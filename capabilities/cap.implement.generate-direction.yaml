# capabilities/cap.implement.generate-direction.yaml
#
# ======================== REAL GENERATION — spec §5 ========================
# The PRODUCTION generation leaf of the annealing spine. Supersedes the
# Increment-I stub (design/cap.run.generate-direction) — that stub is KEPT as
# the offline test substrate (see its header + flow.anneal.structure-first.offline);
# this cap NEVER falls back to it. If the model call fails, this cap FAILS FAST
# (no silent stub substitution).
#
# WHAT IT DOES (spec §5 + the 2026-08-03 "Generation grounding" note):
#   generation = `kind: agent` bound to the **design affinity** (→ Kimi K3 via
#   the operator's models.yaml, swappable in one line) running the hash-pinned
#   `implement.design-direction` skill over ONE hard-constraint, app-appropriate
#   seed → writes ONE self-contained, distinctive HTML candidate. NOT 21st.
#
# ENGINE GROUNDING (V-rules, verified against the praxec source):
#   - VERB (V1/V6): the cap uses the COGNITIVE verb `implement`. The earlier
#     stub used the DETERMINISTIC verb `run` (correct for a script emitter), but
#     a Deterministic verb's primary executor may not be an agent (V6). Real,
#     model-driven generation is cognitive → `implement` (spec §5 anticipated
#     exactly this verb shift: "becomes a cognitive cap under implement/compose").
#   - AGENT PRIMARY (V6): `kind: agent` is NOT a legal INITIAL-state primary
#     (V6 inspects the initial state; Cognitive primaries = mcp|noop|
#     deterministic-authoring kinds). So the initial state is a `noop` prep gate,
#     and the `kind: agent` step lives in the SECOND state (`generating`) — the
#     grounded shape for an agent-driven cognitive cap.
#   - AFFINITY: `affinity: design` is an OPEN activity key (AffinityRef falls
#     back to Activity(<string>) for non-closed names), resolved against the
#     operator's models.yaml `activity: { design: ... }` (see docs/models.example.yaml).
#   - MODELS.YAML: any `kind: agent` step makes `gateway.models_yaml` a hard
#     requirement at check + serve (AGENT_MODELS_YAML_REQUIRED). The operator
#     points it at a models.yaml that binds the `design` activity to Kimi K3.
#
# FAIL-FAST CANDIDATE_NOT_RENDERABLE (coding-write-evidence discipline): the
# agent's own claim is NOT trusted. `requires_file_write: true` already refuses
# an agent turn with zero real write_file calls; then a DETERMINISTIC verifier
# re-opens the candidate at its computed path and confirms it exists + parses as
# HTML. A described-but-unwritten (or unparseable) candidate → terminal failure
# with reason CANDIDATE_NOT_RENDERABLE. Never a stub, never a fabricated pass.
workflows:
  cap.implement.generate-direction:
    verb: implement
    lifecycle: experimental
    tags: [design, generation, distinctive, fit-for-purpose, kimi]
    description: >
      REAL generation: a `kind: agent` step bound to the `design` affinity (→
      Kimi K3, swappable) runs the hash-pinned implement.design-direction skill
      over one hard-constraint, app-appropriate seed and WRITES one self-
      contained, distinctive HTML candidate. Fail-fast CANDIDATE_NOT_RENDERABLE
      when no real, parseable HTML file was written (no fallback to the stub).
    snippet:
      inputs:
        # Directory to write the candidate HTML into (the run's artifacts dir).
        out_dir:      { type: string, required: true }
        # The hard-constraint seed set as a JSON string (corners/type/grid/…).
        seed:         { type: string, default: "{}" }
        # The app-type core-needs profile as a JSON string (fit-for-purpose §4).
        profile:      { type: string, default: "" }
        # Stable candidate id — the artifact filename is candidate-<id>.html.
        candidate_id: { type: string, default: "" }
        # OPTIONAL content source: an abs path to a file holding the TARGET
        # page's REAL copy. When non-empty the agent reads it (file-read tool)
        # and lays out EXACTLY that copy instead of inventing content, so every
        # candidate renders the same words and the only variable is the design.
        # Empty ⇒ representative content for the app type (Increment-I default).
        content_path: { type: string, default: "" }
        # OPTIONAL aesthetic direction (from cap.research.direction). The overall
        # taste/register the candidate should serve (e.g. "enterprise, trustworthy,
        # calm; institutional not boutique"), SEPARATE from the hard structural
        # seed — the seed carries geometry, this carries feel. "" ⇒ no extra
        # guidance (the seed + profile alone govern; pre-front-end behavior).
        direction_brief: { type: string, default: "" }
        # OPTIONAL visual references (praxec 0.0.48+ governed image inputs): a JSON
        # array STRING of image paths — reference-site screenshots + operator
        # moodboard images — the generation agent SEES (not just reads DNA about).
        # Flattened into image message-parts by the engine. "" / "[]" ⇒ no images
        # (text-only, pre-vision behavior). The design affinity model must be
        # vision-capable (kimi-k3 is).
        reference_images_json: { type: string, default: "" }
      outputs:
        candidate: { type: object }
    initialState: preparing
    initialContext:
      assets_ok:   false
      renderable:  false
      candidate:   {}
      reason:      ""
      content_ok:  false
      content_rel: ""
    states:

      # V6-legal initial primary (noop): a prep gate so the agent step is not the
      # initial-state transition. Routes straight into generation.
      preparing:
        goal: Prepare to generate one candidate for the seed.
        transitions:
          prepare:
            target: checking_content
            actor: deterministic
            executor: { kind: noop }

      # PREFLIGHT (D8): resolve content_path against the agent's file host BEFORE
      # spending a frontier generation on it. The agent cannot distinguish an
      # unreadable content source from an absent one — its prompt falls back to
      # representative copy for both — so a stated-but-unreadable source silently
      # produced an UNGROUNDED candidate that passed every downstream check.
      # Deterministic code makes that distinction; the agent never gets to.
      checking_content:
        goal: Confirm the named content source is actually readable by the agent.
        transitions:
          check:
            target: content_gate
            actor: deterministic
            executor:
              kind: script
              subject: verify.content-source
              args:
                - "$.workflow.input.out_dir"
                - "$.workflow.input.content_path"
            output:
              content_ok:  "$.output.json.content_ok"
              content_rel: "$.output.json.content_rel"
              reason:      "$.output.json.reason"

      content_gate:
        transitions:
          ok:
            target: generating
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.content_ok == true" }
          unreadable:
            target: failed
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.content_ok != true" }

      # THE REAL GENERATION STEP. `kind: agent` + design affinity + the pinned
      # skill (in scope at state level → assembled as the system message). The
      # goal (the task/user message) injects the seed, profile and exact output
      # path. requires_file_write makes a zero-write turn a loud failure.
      generating:
        skills: [implement.design-direction]
        goal: >
          Generate ONE distinctive, fit-for-purpose UI-design direction.
        transitions:
          generate:
            target: verifying
            actor: agent
            executor:
              kind: agent
              affinity: design
              requires_file_write: true
              # Real artwork + real type + a finished (not sketched) page is a
              # LONGER turn than a polygon wireframe. 900s truncated candidates
              # mid-write once the asset rule opened up.
              max_seconds: 2700
              # The per-call timeout above is NOT the step ceiling; that is
              # step_budget_seconds, default 900. Generation with real artwork and
              # a finished page is several calls, so the raise in #4 was never
              # actually in force.
              step_budget_seconds: 2700
              # EXPLICIT file host rooted at the (absolute) out_dir so write_file /
              # read_file are ALWAYS granted. CompositeToolHost only exposes file
              # tools when the connection root is ABSOLUTE (file_tools.rs:361-369);
              # relying on the gateway auto_drive_tools `file:{{ $.run.repo_root }}`
              # failed for this sub-workflow agent (root rendered empty → NO file
              # tools → AGENT_NO_FILE_WRITES). A per-state `tools:` overrides the
              # gateway default; generation needs only the file host (read the
              # content, write the candidate), no MCP tools.
              tools:
                - "file:{{ $.workflow.input.out_dir }}"
              owned_files:
                - "{{ $.workflow.input.out_dir }}/candidate-{{ $.workflow.input.candidate_id }}.html"
              # Governed VISUAL references (0.0.48+): one array-valued entry the
              # engine flattens into image message-parts — the agent SEES the
              # reference screenshots/moodboard while it designs. Empty ⇒ no images.
              images:
                - "{{ $.workflow.input.reference_images_json }}"
              goal: >
                Generate ONE UI-design direction as a single self-contained,
                renderable HTML file and WRITE it with your file-write tool. Your
                file tools are ROOTED at your working directory — use RELATIVE
                paths. Write to EXACTLY this relative path:

                  candidate-{{ $.workflow.input.candidate_id }}.html

                candidate id: {{ $.workflow.input.candidate_id }}

                Honor the HARD seed constraints (each key is a requirement a
                deterministic scorer will verify against your rendered CSS/DOM):
                  seed = {{ $.workflow.input.seed }}

                Serve the app's core needs (fit-for-purpose):
                  profile = {{ $.workflow.input.profile }}

                Serve this overall AESTHETIC DIRECTION (the taste/register/feel —
                honor it alongside the hard seed; the seed sets geometry, this sets
                tone). If empty, let the seed + profile govern:
                  direction = {{ $.workflow.input.direction_brief }}

                If IMAGES are attached to this message, they are VISUAL REFERENCES
                (screenshots of sites/moodboards the direction points to — some to
                emulate the register of, and, if the direction says so, some to
                surpass or avoid). Study them: their palette, type register, layout
                structure, density, and trust signals inform your composition. Do
                NOT copy any one of them; synthesize the direction they collectively
                imply, expressed through THIS candidate's hard seed. If none are
                attached, rely on the direction text + seed.

                If the content source line below is NON-EMPTY, that file has
                ALREADY BEEN VERIFIED to exist and be readable at that path,
                relative to your working directory. READ it with your file-read
                tool and lay out EXACTLY that copy — do not invent, add, reorder,
                or drop content; the words are fixed, the DESIGN is yours. If you
                cannot read it, STOP and say so — do NOT substitute content of
                your own; an ungrounded candidate is worse than no candidate.
                Only when the line below is EMPTY is there no content source, and
                only then should you use representative content for the app type.
                  content source: {{ $.workflow.input.content_path }}

                Be distinctive — do NOT emit the generic default (Inter + dark
                gradient + rounded cards + centered symmetric grid). Express the
                seed's DNA in real compositional geometry.

                Inline ALL CSS. Make NO NETWORK REQUESTS — no CDN stylesheets,
                no webfont services, no remote images or scripts; the page must
                render with the network unplugged. But LOCAL FILES ALREADY IN
                YOUR WORKING DIRECTORY ARE NOT EXTERNAL: if imagery or font
                files are present, USE THEM via relative paths. Real artwork and
                real type are what separate a design from a wireframe; do not
                substitute inline <svg> shape-assemblies for a real image that
                is sitting in the same folder.

                Use the MODERN platform: semantic HTML5, CSS grid, custom
                properties, aspect-ratio/object-fit, clamp(), :has(), container
                queries, CSS animation, prefers-color-scheme and
                prefers-reduced-motion. Inline <script> is allowed for
                behaviour, but the page must be COMPLETE WITHOUT IT — the
                scorer reads the STATIC DOM and CSS, so anything you build in
                JavaScript is invisible to it and scores as absent.

                Write the file, then stop — the file on disk is the deliverable,
                not a description of it.
            output:
              agent_report: "$.output"

      # DETERMINISTIC verify (coding-write-evidence): recompute the artifact path
      # and confirm a real, parseable HTML file was written. Emits the candidate
      # object (mirrors the stub's { id, artifact, seed, generator } contract) and
      # a `renderable` flag the gate routes on.
      verifying:
        goal: Verify the agent wrote a real, renderable HTML candidate.
        transitions:
          verify:
            target: verify_gate
            actor: deterministic
            executor:
              kind: script
              subject: verify.candidate-renderable
              args:
                - "$.workflow.input.out_dir"
                - "$.workflow.input.seed"
                - "$.workflow.input.candidate_id"
            output:
              renderable: "$.output.json.renderable"
              candidate:  "$.output.json.candidate"
              reason:     "$.output.json.reason"

      verify_gate:
        transitions:
          ok:
            target: checking_assets
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.renderable == true" }
          not_renderable:
            target: failed
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.renderable != true" }

      # ASSET REFERENCES (#4 made local assets legal; nothing checked them).
      # A candidate that references files which are not there renders as a page
      # full of broken-image icons while parsing perfectly — observed live, and
      # carried four generations toward a human before anyone noticed. A network
      # reference is the same class: it renders here and fails everywhere else,
      # including in the headless screenshotter.
      checking_assets:
        goal: Confirm every referenced asset is a local file that exists.
        transitions:
          check:
            target: assets_gate
            actor: deterministic
            executor:
              kind: script
              subject: verify.assets-resolve
              args:
                - "{{ $.workflow.input.out_dir }}/candidate-{{ $.workflow.input.candidate_id }}.html"
            output:
              assets_ok: "$.output.json.assets_ok"
              reason:    "$.output.json.reason"

      assets_gate:
        transitions:
          ok:
            target: done
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.assets_ok == true" }
          broken:
            target: failed
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.assets_ok != true" }

      done:
        terminal: true
        outcome: success

      failed:
        terminal: true
        outcome: failure
