# capabilities/cap.implement.apply-design-system.yaml
#
# ======================== REAL APPLY — spec §4b ============================
# The PRODUCTION apply leaf of the rollout spine. Supersedes the offline stub
# (design/cap.run.apply-design-system) — that stub is KEPT as the offline test
# substrate (see its header + flow.rollout.offline); this cap NEVER falls back to
# it. If the model call fails, this cap FAILS FAST (no silent stub substitution).
#
# WHAT IT DOES (spec §4b tiered economics):
#   apply = `kind: agent` bound to the **rollout affinity** (→ deepseek via the
#   operator's models.yaml, swappable in one line) running the hash-pinned
#   `implement.roll-surface` skill over ONE surface + the captured token contract
#   → READS the target repo's EXISTING surface file (repo_root/<surface.file>) and
#   REWRITES it IN PLACE, preserving its framework/markup/logic and changing only
#   the design tokens/classes so it uses ONLY the design system's tokens, adapted to
#   the surface's layout-type. COMMODITY propagation of an already-decided design
#   (frontier designed it; this only rolls it out) — NOT a self-contained HTML
#   generator; it edits the real files at their own paths.
#
# ENGINE GROUNDING (V-rules, mirrors cap.implement.generate-direction):
#   - VERB (V1/V6): the COGNITIVE verb `implement` (the stub used the DETERMINISTIC
#     verb `run`, correct for a script emitter; a Deterministic verb's primary may
#     not be an agent — V6). Real, model-driven apply is cognitive → `implement`.
#   - AGENT PRIMARY (V6): `kind: agent` is NOT a legal INITIAL-state primary, so the
#     initial state is a `noop` prep gate and the agent step lives in the SECOND
#     state (`applying`).
#   - AFFINITY: `affinity: rollout` is an OPEN activity key resolved against the
#     operator's models.yaml `activity: { rollout: ... }` (see docs/models.example.yaml).
#   - MODELS.YAML: any `kind: agent` step makes `gateway.models_yaml` a hard
#     requirement at check + serve (AGENT_MODELS_YAML_REQUIRED).
#
# FAIL-FAST SURFACE_NOT_ROLLED (coding-write-evidence discipline): the agent's own
# claim is NOT trusted. `requires_file_write: true` refuses an agent turn with zero
# real write_file calls; then a DETERMINISTIC verifier (verify.surface-rolled)
# re-opens the EDITED file at its own repo path (repo_root/<surface.file>) and
# confirms it exists + is a real, non-empty source file.
# The anti-regression token-adherence + detect gates run SEPARATELY in the
# flow.rollout orchestrator (identical to the offline stub twin). Never a stub,
# never a fabricated pass.
workflows:
  cap.implement.apply-design-system:
    verb: implement
    lifecycle: experimental
    tags: [design, rollout, commodity, token-adherence, deepseek]
    description: >
      REAL apply: a `kind: agent` step bound to the `rollout` affinity (→ deepseek,
      swappable) runs the hash-pinned implement.roll-surface skill over one surface
      + the captured token contract and EDITS the target repo's EXISTING surface file
      IN PLACE (repo_root/<surface.file>) — preserving its framework/markup/logic and
      changing only the design tokens/classes so it uses ONLY the design system's
      tokens, adapted to the layout-type. Fail-fast SURFACE_NOT_ROLLED when no real,
      non-empty file was written in place (no fallback to the stub).
    snippet:
      inputs:
        # Absolute path to the target repo whose surface file is EDITED IN PLACE.
        repo_root: { type: string, required: true }
        # The surface descriptor { id, file, layout_type } as a JSON object.
        # `file` is the repo-relative path of the surface edited in place.
        surface: { type: object, required: true }
        # The captured token contract { colors, fonts, scale } as a JSON object.
        tokens:  { type: object, required: true }
        # The repo-relative path to the ONE central token source (stylesheet) that
        # holds the contract as `:root` custom properties. The surface CONSUMES these
        # central tokens (via var(--...)) — it MUST NOT re-declare them.
        token_target: { type: string, required: true }
        # Optional retry attempt number (carried into the record).
        attempt: { type: integer, default: 0 }
      outputs:
        rolled: { type: object }
    initialState: preparing
    initialContext:
      rolled_ok: false
      rolled:    {}
      reason:    ""
    states:

      # V6-legal initial primary (noop): a prep gate so the agent step is not the
      # initial-state transition. Routes straight into apply.
      preparing:
        goal: Prepare to roll one surface to the captured design system.
        transitions:
          prepare:
            target: applying
            actor: deterministic
            executor: { kind: noop }

      # THE REAL APPLY STEP. `kind: agent` + rollout affinity + the pinned skill
      # (in scope at state level → assembled as the system message). The goal (the
      # task/user message) injects the surface, the token contract and the exact
      # output path. requires_file_write makes a zero-write turn a loud failure.
      applying:
        skills: [implement.roll-surface]
        goal: >
          Roll ONE surface to the approved design system (token-adherent).
        transitions:
          apply:
            target: verifying
            actor: agent
            executor:
              kind: agent
              affinity: rollout
              requires_file_write: true
              max_seconds: 2700
              # EXPLICIT file host rooted at the (absolute) repo_root so read_file /
              # write_file / edit_file are ALWAYS granted over the TARGET REPO (same
              # seam as generate-direction's absolute-rooted file host). Absolute root
              # ⇒ real file tools; a relative/empty root yields NO file tools →
              # AGENT_NO_FILE_WRITES. The agent reads + rewrites the repo's own file.
              tools:
                - "file:{{ $.workflow.input.repo_root }}"
              owned_files:
                - "{{ $.workflow.input.surface.file }}"
              goal: >
                EDIT ONE existing surface of the target repo IN PLACE so it adopts
                the approved design system. Your file tools are ROOTED at the target
                repo — use RELATIVE paths. FIRST read the existing surface, THEN
                rewrite that SAME file in place (write_file / edit_file to the SAME
                relative path). The file to edit is EXACTLY:

                  {{ $.workflow.input.surface.file }}

                surface: {{ $.workflow.input.surface }}

                WRITE GUARD (a failed run otherwise): Edit ONLY the single file
                named in this task (the surface file). You MUST NOT modify
                package.json, package-lock.json, yarn.lock, pnpm-lock.yaml, any
                astro.config.*, tsconfig*, or any other build/config/dependency
                file, and you MUST NOT run any package manager or add
                dependencies. Touching any file other than your one target is a
                failed run.

                PRESERVE the file's existing content, structure, framework, markup,
                imports, and logic (it is `.astro` / `.css` / `.tsx` — keep the
                markup, frontmatter, imports, and scripts). Change ONLY the design:
                make the page CONSUME the CENTRAL tokens and REMOVE any hardcoded
                off-system colors/fonts. Do NOT convert the file to a self-contained
                HTML document and do NOT drop or reorder content.

                The design system's tokens ALREADY live — defined ONCE — as `:root`
                CSS custom properties in the central token source:
                  {{ $.workflow.input.token_target }}
                CONSUME them: reference the custom properties via `var(--...)` (and
                the shared classes defined in that central file) for every color,
                font, and type size. Do NOT paste hex/font VALUES into this page and
                do NOT re-declare the tokens here — the central file is the ONLY place
                they live. This page is a CONSUMER of the single source of truth.

                Use ONLY this token contract — its palette hexes and font stack are
                a CLOSED set; a deterministic gate will BLOCK any off-system color
                or font, so a page that hardcodes an off-contract value FAILS while a
                page that references the central `var(--token)` / shared classes
                passes:
                  tokens = {{ $.workflow.input.tokens }}

                Adapt the design to the surface's layout_type (landing / blog /
                utility / app-screen) while keeping the tokens + design DNA constant.
                Rewrite the file, then stop — the edited file on disk, at its own
                path, is the deliverable, not a description of it. A
                described-but-unwritten edit is a FAILURE.
            output:
              agent_report: "$.output"

      # DETERMINISTIC verify (coding-write-evidence): recompute the artifact path
      # and confirm a real, parseable HTML file was written. Emits the `rolled`
      # record (mirrors the stub's contract) + a `rolled_ok` flag the gate routes on.
      verifying:
        goal: Verify the agent wrote a real, renderable rolled surface.
        transitions:
          verify:
            target: verify_gate
            actor: deterministic
            executor:
              kind: script
              subject: verify.surface-rolled
              args:
                - "$.workflow.input.repo_root"
                - "$.workflow.input.surface"
                - "$.workflow.input.attempt"
            output:
              rolled_ok: "$.output.json.rolled_ok"
              rolled:    "$.output.json.rolled"
              reason:    "$.output.json.reason"

      verify_gate:
        transitions:
          ok:
            target: done
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.rolled_ok == true" }
          not_rolled:
            target: failed
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.rolled_ok != true" }

      done:
        terminal: true
        outcome: success

      failed:
        terminal: true
        outcome: failure
