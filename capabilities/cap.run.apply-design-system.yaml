# capabilities/cap.run.apply-design-system.yaml
#
# ==================== STUB — the OFFLINE ROLLOUT SUBSTRATE ====================
# The REAL apply path lands in Increment IV-c: a commodity coding leaf
# (deepseek-v4-pro, `affinity: coding`, `requires_file_write: true`) that WRITES
# each surface to the token contract + its layout-type. This stub is DELIBERATELY
# KEPT as the offline test substrate: it lets the flow.rollout spine (capture →
# apply → token-adherence + detect gates → collect) be driven HEADLESS + OFFLINE
# with no OpenRouter key/credit and no `kind: agent` model call — exercised by
# orchestrators/flow.rollout.offline via scripts-library/smoke.rollout.sh. The
# PRODUCTION orchestrator (flow.rollout) references the REAL coding cap, never this
# one; the real cap NEVER falls back here. Mirrors cap.run.generate-direction
# (the annealing spine's offline stub) EXACTLY.
#
# What it honestly does: emits a deterministic, self-contained "rolled" surface
# whose CSS uses ONLY the captured contract's palette + font stack — token-adherent
# + detect-clean by construction, so the offline spine reaches the gates GREEN. The
# HTML is authored by the stub — it is NEVER "generated by a model". A `defect:true`
# surface flips it to emit an OFF-SYSTEM color/font (the anti-regression proof
# affordance) so the token-adherence gate can be shown to BLOCK.
#
# Renamed-verb note: for the deterministic stub, `run` is the honest blessed verb
# ("run the stub coder"). The real IV-c leaf is a COGNITIVE cap (a coding-affinity
# agent) under a cognitive verb (`implement`) — a deliberate verb change reflecting
# the shift from deterministic stub to model generation (same as generate-direction).
#
# V6: `run` is Deterministic → primary `kind: script`. Emits a `rolled` record
# (id + artifact path + surface + layout_type) into $.context for the gates.
workflows:
  cap.run.apply-design-system:
    verb: run
    lifecycle: experimental
    description: >
      STUB (Increment IV-a): roll a surface to the captured design system by
      emitting a deterministic, self-contained file whose CSS uses ONLY the
      contract's token palette + font stack (token-adherent + detect-clean by
      construction), so the capture → apply → gate → collect spine is exercisable
      offline. NOT deepseek, NOT an LLM — replaced by the real coding-affinity apply
      cap in Increment IV-c. A `defect:true` surface emits an off-system color/font
      to exercise the gate's BLOCK path.
    snippet:
      inputs:
        # Directory to write the rolled surface into (created if absent).
        out_dir: { type: string, required: true }
        # The surface descriptor { id, file, layout_type, defect? } as a JSON object
        # (the engine stringifies it into the script arg).
        surface: { type: object, required: true }
        # The captured token contract { colors, fonts, scale } as a JSON object.
        tokens:  { type: object, required: true }
        # Optional retry attempt number (carried into the record only).
        attempt: { type: integer, default: 0 }
      outputs:
        rolled: { type: object }
    initialState: rolling
    states:
      rolling:
        goal: Emit a token-adherent rolled surface (stub, offline).
        transitions:
          apply:
            target: done
            actor: deterministic
            executor:
              kind: script
              subject: run.apply-design-system
              args:
                - "$.workflow.input.out_dir"
                - "$.workflow.input.surface"
                - "$.workflow.input.tokens"
                - "$.workflow.input.attempt"
            output:
              rolled: "$.output.json.rolled"
      done: { terminal: true }
