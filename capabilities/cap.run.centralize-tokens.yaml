# capabilities/cap.run.centralize-tokens.yaml
#
# ==================== STUB — the OFFLINE CENTRALIZE SUBSTRATE =================
# The REAL centralize path is the `rollout`-affinity agent leaf
# (design/cap.implement.centralize-tokens). This stub is DELIBERATELY KEPT as the
# offline test substrate: it lets the flow.rollout spine (capture → CENTRALIZE →
# fan-out → gates → collect) be driven HEADLESS + OFFLINE with no OpenRouter
# key/credit and no `kind: agent` model call — exercised by orchestrators/
# flow.rollout.offline. The PRODUCTION orchestrator (flow.rollout) references the
# REAL agent cap, never this one; the real cap NEVER falls back here. Mirrors
# cap.run.apply-design-system (the fan-out's offline stub) EXACTLY.
#
# What it honestly does: EDITS the central stylesheet IN PLACE — reads
# repo_root/<token_target> (creating it if the target has no central stylesheet
# yet — centralization legitimately establishes the source), injects a `:root`
# block of CSS custom properties from the contract, and normalizes any existing
# off-contract color/font literals to the contract, so the edited file is the
# canonical, token-adherent single source of truth and the offline spine reaches
# the fan-out with a real central file to consume. The edit is authored by the
# stub — it is NEVER "generated by a model".
#
# Renamed-verb note: for the deterministic stub, `run` is the honest blessed verb
# ("run the stub centralizer"). The real leaf is a COGNITIVE cap (a rollout-
# affinity agent) under a cognitive verb (`implement`) — a deliberate verb change
# reflecting the shift from deterministic stub to model generation.
#
# V6: `run` is Deterministic → primary `kind: script`. Emits a `centralized` record
# (id + artifact path + file) into $.context.
workflows:
  cap.run.centralize-tokens:
    verb: run
    lifecycle: experimental
    description: >
      STUB: centralize the captured design system into ONE token source by EDITING
      the target repo's central stylesheet IN PLACE — reads repo_root/<token_target>
      (creating it if absent), injects a `:root` block of CSS custom properties from
      the contract (colors → palette hexes, fonts → the stack, scale → the type
      scale), and normalizes any existing off-contract literals — so the edited file
      is the canonical, token-adherent single source of truth and the capture →
      centralize → fan-out spine is exercisable offline. NOT deepseek, NOT an LLM —
      replaced by the real rollout-affinity centralize cap in production.
    snippet:
      inputs:
        # Absolute path to the target repo whose central stylesheet is edited in place.
        repo_root: { type: string, required: true }
        # The target-repo-RELATIVE path of the ONE central token source (stylesheet).
        token_target: { type: string, required: true }
        # The captured token contract { colors, fonts, scale } as a JSON object
        # (the engine stringifies it into the script arg).
        tokens:  { type: object, required: true }
        # Optional retry attempt number (carried into the record only).
        attempt: { type: integer, default: 0 }
      outputs:
        centralized: { type: object }
    initialState: centralizing
    states:
      centralizing:
        goal: Edit the central token file in place, contract-adherent (stub, offline).
        transitions:
          centralize:
            target: done
            actor: deterministic
            executor:
              kind: script
              subject: run.centralize-tokens
              args:
                - "$.workflow.input.repo_root"
                - "$.workflow.input.token_target"
                - "$.workflow.input.tokens"
                - "$.workflow.input.attempt"
            output:
              centralized: "$.output.json.centralized"
      done: { terminal: true }
