# capabilities/cap.run.generate-direction.yaml
#
# ==================== STUB — the OFFLINE TEST SUBSTRATE ====================
# The REAL generation path now lives in design/cap.implement.generate-direction
# (a `kind: agent` cap bound to the `design` affinity → Kimi K3). This stub is
# DELIBERATELY KEPT as the offline test substrate: it lets the annealing spine
# (generate → render → score → detect) be driven HEADLESS + OFFLINE with no
# OpenRouter key/credit and no `kind: agent` model call — exercised by
# orchestrators/flow.anneal.structure-first.offline via scripts-library/
# smoke.drive.sh. The PRODUCTION orchestrator (flow.anneal.structure-first)
# references the REAL cap, never this one; the real cap NEVER falls back here.
#
# What it honestly does: emits a deterministic, renderable fixture candidate
# that GENUINELY honors the seed (corners/type/grid), so the spine runs offline.
# The emitted HTML is authored by the stub — it is NEVER "generated by a model".
# ===========================================================================
#
# Renamed from `cap.generate.direction`: the cap verb cloud (SPEC §4) has no
# `generate` verb. For the Increment-I DETERMINISTIC stub, `run` is the honest
# blessed verb ("run the stub generator"). When the real 21st generation lands,
# that becomes a COGNITIVE cap (a design-affinity agent, `kind: mcp`) under a
# cognitive verb (e.g. `implement`/`compose`) — a deliberate verb change that
# reflects the shift from deterministic stub to model generation.
#
# V6: `run` is Deterministic → primary `kind: script`. Emits a `candidate`
# (id + artifact path + echoed seed) into $.context for render/score/detect.
workflows:
  cap.run.generate-direction:
    verb: run
    lifecycle: experimental
    description: >
      STUB (Increment I): emit a deterministic, renderable fixture candidate
      that honors the seed's hard constraints (corners/type/grid), so the
      generate → render → score → detect spine is exercisable offline. NOT 21st,
      NOT an LLM — replaced by the real design-affinity generation cap in
      Increment II.
    snippet:
      inputs:
        # Directory to write the candidate HTML into (created if absent).
        # Typically the run's artifacts dir; passed by the orchestrator.
        out_dir:      { type: string, required: true }
        # The hard-constraint seed set as a JSON string (corners/type/grid).
        seed:         { type: string, default: "{}" }
        # Optional stable candidate id.
        candidate_id: { type: string, default: "" }
      outputs:
        candidate: { type: object }
    initialState: generating
    states:
      generating:
        goal: Emit an in-seed renderable fixture candidate (stub, offline).
        transitions:
          generate:
            target: done
            actor: deterministic
            executor:
              kind: script
              subject: run.generate-direction
              args:
                - "$.workflow.input.out_dir"
                - "$.workflow.input.seed"
                - "$.workflow.input.candidate_id"
            output:
              candidate: "$.output.json.candidate"
      done: { terminal: true }
