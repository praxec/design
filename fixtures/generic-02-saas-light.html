<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowly — Work, simplified</title>
<style>
  * { box-sizing:border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background:#f9fafb; color:#111827; margin:0;
  }
  .wrap { max-width:1080px; margin:0 auto; padding:88px 24px; text-align:center; }
  h1 { font-size:42px; font-weight:700; letter-spacing:-0.02em; margin:0 0 16px; }
  p.sub { font-size:18px; color:#6b7280; margin:0 0 28px; }
  .btn {
    background:#2563eb; color:#fff; border:none; border-radius:8px;
    padding:12px 24px; font-size:16px; font-weight:600;
  }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:56px; }
  .card {
    background:#fff; border:1px solid #e5e7eb; border-radius:12px;
    padding:28px; box-shadow:0 1px 3px rgba(0,0,0,.08);
  }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Work, simplified</h1>
    <p class="sub">Everything your team needs, in one clean place.</p>
    <button class="btn">Start for free</button>
    <section class="grid">
      <div class="card"><h3>Organize</h3><p>Keep every task in view.</p></div>
      <div class="card"><h3>Collaborate</h3><p>Work together in real time.</p></div>
      <div class="card"><h3>Automate</h3><p>Let the busywork run itself.</p></div>
    </section>
  </main>
</body>
</html>
