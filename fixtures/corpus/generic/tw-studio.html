<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>snapshot</title>
<style>
body{font-family:'Mona Sans', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';background:rgba(0, 0, 0, 0);color:#111;margin:0}
.hero{text-align:left;padding:40px}
.display{font-family:'Mona Sans', ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';font-size:64px;margin:0}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:40px}
.card{border-radius:9999px;padding:24px;background:#f4f4f4}
.rule{border:1px solid #111}
.accent{color:#111111;padding:0 40px}
</style></head>
<body>
<!-- computed-geometry snapshot of https://studio.tailwindui.com -->
<header class="hero"><h1 class="display">Rendered geometry snapshot</h1></header>
<main class="layout"><section class="card rule">column a</section><section class="card">column b</section></main>
<p class="accent">accent sample</p>
</body></html>
