<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>snapshot</title>
<style>
body{font-family:'Gooper SemiCondensed', 'Iowan Old Style', 'Times New Roman', Times, serif;background:linear-gradient(135deg,#111,#333);color:#111;margin:0}
.hero{text-align:left;padding:40px}
.display{font-family:'Gooper SemiCondensed', 'Iowan Old Style', 'Times New Roman', Times, serif;font-size:32px;margin:0}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:40px}
.card{border-radius:28px;padding:24px;background:#f4f4f4}
.rule{border:1px solid #111}
.accent{color:#fde300;padding:0 40px}
</style></head>
<body>
<!-- computed-geometry snapshot of https://pudding.cool -->
<header class="hero"><h1 class="display">Rendered geometry snapshot</h1></header>
<main class="layout"><section class="card rule">column a</section><section class="card">column b</section></main>
<p class="accent">accent sample</p>
</body></html>
