<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>snapshot</title>
<style>
body{font-family:HaasText, Arial, sans-serif;background:rgb(255, 255, 255);color:#111;margin:0}
.hero{text-align:center;padding:40px}
.display{font-family:HaasText, Arial, sans-serif;font-size:31px;margin:0}
.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:40px}
.card{border-radius:9999px;padding:24px;background:#f4f4f4}
.rule{border:5px solid #111}
.accent{color:#ffa028;padding:0 40px}
</style></head>
<body>
<!-- computed-geometry snapshot of https://www.bloomberg.com/graphics/2015-whats-warming-the-world/ -->
<header class="hero"><h1 class="display">Rendered geometry snapshot</h1></header>
<main class="layout"><section class="card rule">column a</section><section class="card">column b</section></main>
<p class="accent">accent sample</p>
</body></html>
