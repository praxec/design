<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metric — Analytics for everyone</title>
<style>
  * { box-sizing:border-box; }
  body {
    font-family: Roboto, Helvetica, Arial, sans-serif;
    background:#f3f4f6; color:#1f2937; margin:0;
  }
  .wrap { max-width:1100px; margin:0 auto; padding:80px 24px; text-align:center; }
  h1 { font-size:40px; font-weight:700; margin:0 0 14px; }
  p.sub { font-size:17px; color:#6b7280; margin:0 0 28px; }
  .btn {
    background:#14b8a6; color:#fff; border:none; border-radius:9999px;
    padding:12px 26px; font-size:15px; font-weight:600;
  }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:52px; }
  .card {
    background:#fff; border:1px solid #e5e7eb; border-radius:12px;
    padding:26px; box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Analytics for everyone</h1>
    <p class="sub">Understand your numbers without the spreadsheet headache.</p>
    <button class="btn">Try it free</button>
    <section class="grid">
      <div class="card"><h3>Dashboards</h3><p>See it all at a glance.</p></div>
      <div class="card"><h3>Reports</h3><p>Share insights instantly.</p></div>
      <div class="card"><h3>Alerts</h3><p>Never miss a change.</p></div>
    </section>
  </main>
</body>
</html>
