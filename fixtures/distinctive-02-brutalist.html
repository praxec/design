<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CONCRETE//WORKS</title>
<style>
  * { box-sizing:border-box; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background:#f2ff00; color:#000000; margin:0;
  }
  .bar { border-bottom:6px solid #000; padding:20px 32px; display:flex; justify-content:space-between; }
  .bar span { font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; }
  .hero { padding:56px 32px; border-bottom:6px solid #000; }
  .hero h1 {
    font-size:104px; font-weight:800; line-height:0.86; margin:0;
    text-transform:uppercase; letter-spacing:-0.04em;
  }
  .slab { display:grid; grid-template-columns:1fr 3fr; }
  .slab .l { border-right:6px solid #000; padding:32px; background:#000; color:#f2ff00; }
  .slab .r { padding:32px; font-size:22px; line-height:1.3; }
  .cta { display:inline-block; margin-top:24px; border:4px solid #000; padding:14px 24px;
         font-weight:800; text-transform:uppercase; background:#000; color:#f2ff00; }
</style>
</head>
<body>
  <div class="bar"><span>CONCRETE//WORKS</span><span>EST. 2026</span></div>
  <section class="hero">
    <h1>RAW<br>STRUCTURE<br>NO GLOSS</h1>
  </section>
  <section class="slab">
    <div class="l">INDEX 01/04</div>
    <div class="r">
      Square corners. Six-pixel rules. A screaming primary. This is brutalist by
      construction: the grid is lopsided one-to-three, the type is set in system
      Helvetica but weaponized at scale, and every border is load-bearing.
      <span class="cta">ENTER</span>
    </div>
  </section>
</body>
</html>
