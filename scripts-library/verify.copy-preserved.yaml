# scripts-library/verify.copy-preserved.yaml
#
# The guard that makes visual self-review safe.
#
# A model reviewing its own work and rewriting the file is exactly where
# fabrication creeps in: asked to improve a design, it is one small step from
# "improving" the words too — tightening a heading, adding a caption that reads
# better, inventing a label the layout seems to want. For this pack that would
# be a silent corruption, because the content source is the ONE thing the
# operator fixed so that DESIGN is the only variable between candidates. A
# revision that edits copy has changed the experiment, not the design.
#
# So the review pass is bounded by a deterministic check rather than by asking
# nicely: the visible text of the revised file must be the SAME MULTISET as
# before. Reordering is allowed (that is layout). Restyling is allowed. Adding a
# word, dropping a word, or rewording one is not.
#
# WHAT COUNTS AS TEXT. Visible text nodes only: <script>, <style>, comments and
# attribute values are excluded (a class name is not copy). Whitespace is
# collapsed and case is preserved — "Hello, Rosa" and "HELLO, ROSA" are the same
# words styled differently, so case-folding is applied for comparison while the
# reported diff keeps the original casing.
#
#   Args: [before_path, after_path]
#
# Emits (ALWAYS exit 0 — the cap's gate routes on `copy_preserved`):
#   { copy_preserved: true,  reason: "" }
#   { copy_preserved: false, reason: "REVISION_ALTERED_COPY", added: [...], removed: [...] }
# Only an unreadable argument is a hard error (exit 2).
version: "1.0.0"
scripts:
  verify.copy-preserved:
    verb: verify
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // Deterministic copy-preservation check. No LLM, no network.
      const { existsSync, readFileSync } = require("node:fs");

      const before = process.argv[2];
      const after = process.argv[3];
      if (!before || !after) {
        console.error(JSON.stringify({ error: "PATHS_UNSET" }));
        process.exit(2);
      }
      for (const p of [before, after]) {
        if (!existsSync(p)) {
          console.error(JSON.stringify({ error: "PATH_MISSING", path: p }));
          process.exit(2);
        }
      }

      // Visible text only: drop script/style bodies and comments, then strip
      // tags. Attribute values never enter the token set — a class name or an
      // image path is not copy, and a design change is free to alter them.
      function words(html) {
        const text = html
          .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, " ")
          .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, " ")
          .replace(/<!--[\s\S]*?-->/g, " ")
          .replace(/<[^>]+>/g, " ")
          .replace(/&nbsp;/gi, " ")
          .replace(/&amp;/gi, "&")
          .replace(/&quot;/gi, '"')
          .replace(/&#39;|&apos;/gi, "'")
          .replace(/&lt;/gi, "<")
          .replace(/&gt;/gi, ">");
        // Punctuation is styling as often as it is content (a middot separator,
        // a dash), so compare on word tokens and let punctuation move freely.
        return text
          .split(/\s+/)
          .map((w) => w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, ""))
          .filter(Boolean);
      }

      // Multiset difference, case-insensitive for comparison but reporting the
      // original casing so a human sees what actually moved.
      function diff(a, b) {
        const counts = new Map();
        for (const w of b) {
          const k = w.toLowerCase();
          counts.set(k, (counts.get(k) || 0) + 1);
        }
        const extra = [];
        for (const w of a) {
          const k = w.toLowerCase();
          const n = counts.get(k) || 0;
          if (n > 0) counts.set(k, n - 1);
          else extra.push(w);
        }
        return extra;
      }

      const wBefore = words(readFileSync(before, "utf8"));
      const wAfter = words(readFileSync(after, "utf8"));

      const added = diff(wAfter, wBefore);     // in AFTER, unaccounted for in BEFORE
      const removed = diff(wBefore, wAfter);   // in BEFORE, missing from AFTER

      if (added.length === 0 && removed.length === 0) {
        console.log(JSON.stringify({ copy_preserved: true, reason: "" }));
        process.exit(0);
      }
      console.log(JSON.stringify({
        copy_preserved: false,
        reason: "REVISION_ALTERED_COPY",
        // Bounded: a wholesale rewrite would otherwise dump the whole page into
        // the workflow context. The counts stay exact.
        added: added.slice(0, 40),
        removed: removed.slice(0, 40),
        added_count: added.length,
        removed_count: removed.length,
      }));
