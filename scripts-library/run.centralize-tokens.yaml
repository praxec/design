# scripts-library/run.centralize-tokens.yaml
#
# ==================== STUB — the OFFLINE CENTRALIZE SUBSTRATE =================
# The REAL centralize path is the `rollout`-affinity agent leaf
# (design/cap.implement.centralize-tokens). This stub is the DETERMINISTIC offline
# substrate — it lets the flow.rollout spine (capture → CENTRALIZE → fan-out →
# gates → collect) be driven HEADLESS + OFFLINE with no OpenRouter key/credit and
# no `kind: agent` model call — exercised by orchestrators/flow.rollout.offline.
# The PRODUCTION orchestrator (flow.rollout) references the REAL agent cap, never
# this one; the real cap NEVER falls back here. Mirrors run.apply-design-system
# (the fan-out's offline stub) EXACTLY.
#
# What it honestly does: it makes the CENTRAL token file the single source of
# truth. Given the token target (repo-relative path) + the captured contract, it
# reads repo_root/<token_target> (creating it if the target has no central
# stylesheet yet — centralization legitimately establishes the source), injects a
# marker-delimited `:root { … }` block defining EVERY token as a CSS custom
# property (colors → `--token: hex`, fonts → `--font-body: stack`, scale →
# `--fs-N: <px>`), and normalizes any existing off-contract color/font literals in
# the rest of the file to the contract — so the edited file is, by construction,
# the canonical token source (and token-adherent). The edit is authored by THIS
# stub — never labelled as "generated by a model". It does NOT generate a new
# self-contained file into an out_dir.
# ===========================================================================
#
#   Args: [repo_root, token_target, tokens_json, attempt?]
#     repo_root     absolute path to the target repo whose central stylesheet is
#                   edited in place
#     token_target  the target-repo-RELATIVE path of the ONE central token source
#                   (stylesheet) that becomes the single source of truth
#     tokens_json   the captured token contract { colors:[{token,hex}], fonts,
#                   scale } as JSON — the palette + stack + scale defined in :root
#     attempt       optional retry attempt number (carried into the record only)
#
# Emits { centralized: { id, artifact (= repo_root/token_target, the EDITED file),
# file, generator: "stub-centralize-v1", attempt } }. Fail-fast: exit 2 on missing
# repo_root, unparseable tokens, or an empty token_target.
version: "1.0.0"
scripts:
  run.centralize-tokens:
    verb: run
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // STUB centralize coder (see file header). Deterministic, offline, no LLM.
      // Makes repo_root/<token_target> the single source of truth: injects a
      // :root block of CSS custom properties from the contract + normalizes any
      // existing off-contract color/font literals. Mirrors the real agent leaf
      // (edit the central stylesheet → define tokens once, consume via var()).
      const { existsSync, readFileSync, writeFileSync, mkdirSync } = require("node:fs");
      const { join, isAbsolute, dirname } = require("node:path");

      const repoRoot = process.argv[2];
      if (!repoRoot) {
        console.error(JSON.stringify({ error: "REPO_ROOT_UNSET" }));
        process.exit(2);
      }
      const rel = process.argv[3] || "";
      if (!rel) {
        console.error(JSON.stringify({ error: "TOKEN_TARGET_UNSET", message: "token_target (repo-relative path) is required for centralize-in-place" }));
        process.exit(2);
      }
      let tokens = {};
      try {
        tokens = process.argv[4] ? JSON.parse(process.argv[4]) : {};
      } catch {
        console.error(JSON.stringify({ error: "TOKENS_UNPARSEABLE" }));
        process.exit(2);
      }
      const attempt = parseInt(process.argv[5] || "0", 10) || 0;

      const colors = Array.isArray(tokens.colors) ? tokens.colors : [];
      const palette = colors.map((c) => c.hex).filter(Boolean);
      if (palette.length === 0) palette.push("#000000");
      const fonts = Array.isArray(tokens.fonts) && tokens.fonts.length ? tokens.fonts : ['Georgia, serif'];
      const stack = fonts[0];
      const scale = Array.isArray(tokens.scale) ? tokens.scale : [];

      // Resolve the central token file UNDER the repo root (edit in place).
      const target = isAbsolute(rel) ? rel : join(repoRoot, rel);

      // Centralization legitimately ESTABLISHES the source of truth: if the target
      // repo has no central stylesheet yet, create it (mkdir -p the parent). An
      // existing file is edited in place; its non-:root rules are preserved.
      let src = existsSync(target) ? readFileSync(target, "utf8") : "";

      // Build the canonical :root custom-property block from the contract.
      const BEGIN = "/* praxec:centralized-tokens BEGIN (single source of truth) */";
      const END = "/* praxec:centralized-tokens END */";
      const lines = [":root {"];
      for (const c of colors) {
        if (c && c.token && c.hex) lines.push(`  ${c.token}: ${c.hex};`);
      }
      lines.push(`  --font-body: ${stack};`);
      scale.forEach((s, i) => lines.push(`  --fs-${i + 1}: ${s}px;`));
      lines.push("}");
      const rootBlock = `${BEGIN}\n${lines.join("\n")}\n${END}`;

      // Drop any prior generated block (idempotent re-centralize), then prepend the
      // fresh one so :root is the first, canonical definition in the file.
      const priorBlock = new RegExp(
        BEGIN.replace(/[.*+?^${}()|[\]\\/]/g, "\\$&") +
          "[\\s\\S]*?" +
          END.replace(/[.*+?^${}()|[\]\\/]/g, "\\$&") +
          "\\n?",
        "g"
      );
      src = src.replace(priorBlock, "");

      // Normalize any existing off-contract literals in the rest of the file so the
      // central source itself is token-adherent (colors → palette, fonts → stack).
      let ci = 0;
      src = src.replace(/#[0-9a-fA-F]{3,8}\b/g, () => palette[ci++ % palette.length]);
      src = src.replace(/rgba?\([^)]*\)/gi, () => palette[ci++ % palette.length]);
      src = src.replace(/font-family\s*:\s*[^;}{\n]+/gi, `font-family: ${stack}`);

      const out = `${rootBlock}\n\n${src}`.trimEnd() + "\n";

      // Ensure the parent dir exists, then WRITE THE EDIT back in place.
      mkdirSync(dirname(target), { recursive: true });
      writeFileSync(target, out);
      console.log(JSON.stringify({
        centralized: {
          id: "central-tokens",
          artifact: target,       // the EDITED central stylesheet at its own repo path
          file: rel,
          generator: "stub-centralize-v1",
          attempt,
        },
      }));
