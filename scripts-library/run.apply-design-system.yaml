# scripts-library/run.apply-design-system.yaml
#
# ==================== STUB — the OFFLINE ROLLOUT SUBSTRATE ====================
# The REAL apply path is the commodity coding leaf (deepseek-v4-pro, `affinity:
# coding`, `requires_file_write: true`) that lands in Increment IV-c. This stub is
# the DETERMINISTIC offline substrate — it lets the flow.rollout spine (capture →
# apply → token-adherence + detect gates → collect) be driven HEADLESS + OFFLINE
# with no OpenRouter key/credit and no `kind: agent` model call — exercised by
# orchestrators/flow.rollout.offline via scripts-library/smoke.rollout.sh. The
# PRODUCTION orchestrator (flow.rollout) references the REAL coding cap, never
# this one; the real cap NEVER falls back here.
#
# What it honestly does: it EDITS AN EXISTING surface file IN PLACE (mirrors the
# real IV-c apply, which reads the target repo's file and rewrites it). Given a
# surface + the captured token contract, it READS the existing file at
# repo_root/<surface.file>, rewrites ONLY the design tokens (every off-contract
# color literal → a palette hex; every font-family value → the contract's stack)
# while PRESERVING the file's structure, selectors, and logic verbatim, and writes
# it back to the SAME path — so the edited file uses ONLY the contract's palette +
# font stack and is, by construction, TOKEN-ADHERENT (and detect-clean), and the
# offline spine reaches the gates GREEN. The edit is authored by THIS stub — it is
# never labelled as, and must never be presented as, "generated by deepseek" or any
# model. It does NOT generate a new self-contained file into an out_dir.
# ===========================================================================
#
#   Args: [repo_root, surface_json, tokens_json, attempt?]
#     repo_root     absolute path to the target repo whose file is edited in place
#     surface_json  the surface descriptor as JSON. Recognised keys:
#                     id:          stable surface id (carried into the record)
#                     file:        the target-repo-RELATIVE path of the file this
#                                  stub reads + rewrites IN PLACE (repo_root/file)
#                     layout_type: "landing" | "blog" | "utility" | "app-screen"
#                     defect:      true — TEST-ONLY: after the token-adherent
#                                  rewrite, inject an OFF-SYSTEM color (#123456) +
#                                  an off-system font (Inter) into the edited file
#                                  so the token-adherence gate FAILS (adherent:
#                                  false), forcing the bounded-retry →
#                                  ROLLOUT_REGRESSED path. This is the
#                                  anti-regression proof affordance (mirrors
#                                  run.generate-direction's `defect:true`).
#                                  Absent/false ⇒ a token-adherent edited file.
#     tokens_json   the captured token contract { colors:[{token,hex}], fonts,
#                   scale } as JSON — the palette + stack the edited file uses
#     attempt       optional retry attempt number (carried into the record only)
#
# Emits { rolled: { id, artifact (= repo_root/surface.file, the EDITED file),
# file, layout_type, generator: "stub-rollout-v1", attempt } }. Fail-fast: exit 2
# on missing repo_root, unparseable surface/tokens, a surface with no `file`, or a
# target file that does not exist (edit-in-place requires an EXISTING file).
version: "1.0.0"
scripts:
  run.apply-design-system:
    verb: run
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // STUB rollout coder (see file header). Deterministic, offline, no LLM.
      // EDITS AN EXISTING file IN PLACE: reads repo_root/<surface.file>, rewrites
      // ONLY the design tokens (colors → palette hexes, font-family → the contract
      // stack) while preserving structure/selectors/logic, and writes it back to
      // the SAME path. Mirrors the real IV-c apply (read the target file → rewrite).
      const { existsSync, readFileSync, writeFileSync } = require("node:fs");
      const { join, isAbsolute } = require("node:path");

      const repoRoot = process.argv[2];
      if (!repoRoot) {
        console.error(JSON.stringify({ error: "REPO_ROOT_UNSET" }));
        process.exit(2);
      }
      let surface = {};
      let tokens = {};
      try {
        surface = process.argv[3] ? JSON.parse(process.argv[3]) : {};
      } catch {
        console.error(JSON.stringify({ error: "SURFACE_UNPARSEABLE" }));
        process.exit(2);
      }
      try {
        tokens = process.argv[4] ? JSON.parse(process.argv[4]) : {};
      } catch {
        console.error(JSON.stringify({ error: "TOKENS_UNPARSEABLE" }));
        process.exit(2);
      }
      const attempt = parseInt(process.argv[5] || "0", 10) || 0;

      const id = surface.id || `surface-${Date.now()}`;
      const layoutType = surface.layout_type || "landing";
      const rel = surface.file || "";
      if (!rel) {
        console.error(JSON.stringify({ error: "SURFACE_FILE_UNSET", message: "surface.file (repo-relative path) is required for edit-in-place" }));
        process.exit(2);
      }
      // Resolve the target file UNDER the repo root (edit-in-place, at its own path).
      const target = isAbsolute(rel) ? rel : join(repoRoot, rel);
      // Edit-in-place requires an EXISTING file (mirrors the real apply reading the
      // target repo's surface). A missing file is a hard error, not a silent create.
      if (!existsSync(target)) {
        console.error(JSON.stringify({ error: "SURFACE_ABSENT", message: `target file to edit does not exist: ${target}` }));
        process.exit(2);
      }

      const colors = Array.isArray(tokens.colors) ? tokens.colors : [];
      const palette = colors.map((c) => c.hex).filter(Boolean);
      if (palette.length === 0) palette.push("#000000");
      const fonts = Array.isArray(tokens.fonts) && tokens.fonts.length ? tokens.fonts : ['Georgia, serif'];
      const stack = fonts[0];

      // READ the existing surface, then REWRITE ONLY THE DESIGN TOKENS in place —
      // preserving every selector, property, comment, and structural line verbatim.
      let src = readFileSync(target, "utf8");

      // colors: replace every hex literal with a palette hex (cycled, deterministic)
      // so the edited file references ONLY in-contract hexes.
      let ci = 0;
      src = src.replace(/#[0-9a-fA-F]{3,8}\b/g, () => palette[ci++ % palette.length]);
      // colors: collapse any rgb()/rgba() to an in-contract palette hex too.
      src = src.replace(/rgba?\([^)]*\)/gi, () => palette[ci++ % palette.length]);
      // fonts: rewrite every font-family value to the contract's stack.
      src = src.replace(/font-family\s*:\s*[^;}{\n]+/gi, `font-family: ${stack}`);

      // DEFECT MODE (test affordance, NOT a real coding path): after the
      // token-adherent rewrite, inject an OFF-SYSTEM color + font so the
      // token-adherence gate BLOCKS the edited file. Absent/false ⇒ adherent.
      const defect = surface.defect === true;
      if (defect) {
        src += "\n/* injected off-system drift (test affordance) */\n" +
               ".drift { color: #123456; font-family: Inter, system-ui, sans-serif; }\n";
      }

      // WRITE THE EDIT BACK IN PLACE — same path, preserved structure.
      writeFileSync(target, src);
      console.log(JSON.stringify({
        rolled: {
          id,
          artifact: target,       // the EDITED file at its own repo path
          file: rel,
          layout_type: layoutType,
          generator: "stub-rollout-v1",
          attempt,
        },
      }));
