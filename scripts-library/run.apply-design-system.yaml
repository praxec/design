# scripts-library/run.apply-design-system.yaml
#
# ==================== STUB — the OFFLINE ROLLOUT SUBSTRATE ====================
# The REAL apply path is the commodity coding leaf (deepseek-v4-pro, `affinity:
# coding`, `requires_file_write: true`) that lands in Increment IV-c. This stub is
# the DETERMINISTIC offline substrate — it lets the flow.rollout spine (capture →
# apply → token-adherence + detect gates → collect) be driven HEADLESS + OFFLINE
# with no OpenRouter key/credit and no `kind: agent` model call — exercised by
# orchestrators/flow.rollout.offline via scripts-library/smoke.rollout.sh. The
# PRODUCTION orchestrator (flow.rollout) references the REAL coding cap, never
# this one; the real cap NEVER falls back here.
#
# What it honestly does: given a surface + the captured token contract, it writes a
# real, self-contained "rolled" surface file whose CSS uses ONLY the contract's
# palette + font stack — so it is, by construction, TOKEN-ADHERENT (and detect-
# clean), and the offline spine reaches the gates GREEN. The emitted HTML is
# authored by THIS stub — it is never labelled as, and must never be presented as,
# "generated by deepseek" or any model.
# ===========================================================================
#
#   Args: [out_dir, surface_json, tokens_json, attempt?]
#     out_dir       directory to write the rolled surface into (created if absent)
#     surface_json  the surface descriptor as JSON. Recognised keys:
#                     id:          stable surface id (→ the rolled filename)
#                     file:        the target-repo path this surface stands for
#                     layout_type: "landing" | "blog" | "utility" | "app-screen"
#                     defect:      true — TEST-ONLY: emit an OFF-SYSTEM color
#                                  (#123456) + an off-system font (Inter) so the
#                                  token-adherence gate FAILS (adherent:false),
#                                  forcing the bounded-retry → ROLLOUT_REGRESSED
#                                  path. This is the anti-regression proof
#                                  affordance (mirrors run.generate-direction's
#                                  `defect:true`). Absent/false ⇒ a token-adherent
#                                  rolled surface.
#     tokens_json   the captured token contract { colors:[{token,hex}], fonts,
#                   scale } as JSON — the palette + stack the rolled surface uses
#     attempt       optional retry attempt number (carried into the record only)
#
# Emits { rolled: { id, artifact, file, layout_type, generator: "stub-rollout-v1",
# attempt } }. Fail-fast: exit 2 on missing out_dir or unparseable surface/tokens.
version: "1.0.0"
scripts:
  run.apply-design-system:
    verb: run
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // STUB rollout coder (see file header). Deterministic, offline, no LLM.
      const { mkdirSync, writeFileSync } = require("node:fs");
      const { join } = require("node:path");

      const outDir = process.argv[2];
      if (!outDir) {
        console.error(JSON.stringify({ error: "OUT_DIR_UNSET" }));
        process.exit(2);
      }
      let surface = {};
      let tokens = {};
      try {
        surface = process.argv[3] ? JSON.parse(process.argv[3]) : {};
      } catch {
        console.error(JSON.stringify({ error: "SURFACE_UNPARSEABLE" }));
        process.exit(2);
      }
      try {
        tokens = process.argv[4] ? JSON.parse(process.argv[4]) : {};
      } catch {
        console.error(JSON.stringify({ error: "TOKENS_UNPARSEABLE" }));
        process.exit(2);
      }
      const attempt = parseInt(process.argv[5] || "0", 10) || 0;

      const id = surface.id || `surface-${Date.now()}`;
      const layoutType = surface.layout_type || "landing";
      const colors = Array.isArray(tokens.colors) ? tokens.colors : [];
      const fonts = Array.isArray(tokens.fonts) && tokens.fonts.length ? tokens.fonts : ['Georgia, serif'];

      // Role lookup by token name with a graceful fallback to the palette head, so
      // the rolled CSS ALWAYS uses in-contract hexes (⇒ token-adherent).
      const byToken = (name, fallbackIdx) => {
        const hit = colors.find((c) => c.token === name);
        if (hit) return hit.hex;
        return (colors[fallbackIdx] || colors[0] || { hex: "#000000" }).hex;
      };
      const paper = byToken("--paper", 2);
      const ink = byToken("--ink", 0);
      const accent = byToken("--accent", 4);
      const hair = byToken("--hair", colors.length - 1);
      const stack = fonts[0];

      // DEFECT MODE (test affordance, NOT a real coding path): emit an OFF-SYSTEM
      // color + font the token-adherence gate BLOCKS. Absent/false ⇒ adherent.
      const defect = surface.defect === true;
      const headingColor = defect ? "#123456" : accent;      // off-system hex
      const bodyFont = defect ? "Inter, system-ui, sans-serif" : stack; // off-system font

      const html = `<!doctype html>
      <html lang="en">
      <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="generator" content="praxec/design stub-rollout-v1 (NOT deepseek)" />
      <title>${id} · ${layoutType}</title>
      <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
          margin: 0; background: ${paper}; color: ${ink};
          font-family: ${bodyFont};
        }
        .frame { border: 8px solid ${ink}; margin: 24px; }
        header { border-bottom: 8px solid ${ink}; padding: 28px 32px; }
        h1 { font-size: 40px; line-height: 1.05; margin: 0; color: ${headingColor}; }
        main { display: grid; grid-template-columns: 2fr 5fr 3fr; gap: 0; }
        section { border-right: 6px solid ${ink}; padding: 28px 32px; }
        section:last-child { border-right: 0; }
        h2 { font-size: 17px; margin: 0 0 14px; }
        .card { border: 4px solid ${ink}; padding: 20px; margin-top: 16px; }
        .rule { border-top: 1px solid ${hair}; margin: 16px 0; }
        p { font-size: 17px; line-height: 1.6; }
      </style>
      </head>
      <body>
        <div class="frame">
          <header>
            <h1>${id}</h1>
          </header>
          <main>
            <section>
              <h2>Rolled surface</h2>
              <div class="card"><p>This ${layoutType} surface was rolled to the captured design system by the Increment-IV-a STUB coder, not by deepseek or any LLM.</p></div>
              <div class="rule"></div>
              <div class="card"><p>Its CSS references only the design system's token palette + font stack, so the token-adherence gate passes.</p></div>
            </section>
            <section>
              <h2>Token contract</h2>
              <div class="card"><p>Paper, ink, accent, and hairline are all in-contract hexes. It exists so the capture → apply → gate → collect spine runs offline.</p></div>
            </section>
            <section>
              <h2>Fit-for-purpose</h2>
              <div class="card"><p>Layout adapts per surface type (${layoutType}); the tokens stay constant across every rolled surface.</p></div>
            </section>
          </main>
        </div>
      </body>
      </html>`;

      mkdirSync(outDir, { recursive: true });
      const artifact = join(outDir, `rolled-${id}.html`);
      writeFileSync(artifact, html);
      console.log(JSON.stringify({
        rolled: {
          id,
          artifact,
          file: surface.file || "",
          layout_type: layoutType,
          generator: "stub-rollout-v1",
          attempt,
        },
      }));
