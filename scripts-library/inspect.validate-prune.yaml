# scripts-library/inspect.validate-prune.yaml
#
# The RESUME VALIDATOR + STEER AGGREGATOR of cap.gate.prune-and-steer (spec §6b).
# After the human resumes the parked gate with per-candidate reactions, this
# deterministic leaf (a) refuses a silent partial prune, and (b) turns the raw
# reactions into the annealing STEER the next divergence consumes.
#
# Verb `inspect`: deterministic, read-only over the candidate + feedback records,
# emits ONE structured artifact (the steer). Not the human `gate` itself.
#
#   Args: [candidates_json, feedback_json]
#     candidates_json  the presented eligible candidate array as JSON (each { id, ... })
#     feedback_json    the human's per-candidate reactions as JSON — each
#                      { candidate_id, verdict: keep|branch|compose|reject, rank,
#                        likes[], dislikes[], notes }
#
# Emits { steer: { amplify: [{axis,toward}], avoid: [{axis,toward}] } } on stdout
# (→ $.output.json.steer). The steer is VALENCED — direction, not just axis:
#   amplify = likes of ALL carried-forward directions (verdict != "reject":
#             keep + branch + compose), deduped by axis, distinct `toward`
#             phrases merged with "; " (a composed direction's preferences survive).
#   avoid   = dislikes across the WHOLE spread, deduped by axis; `toward` = the
#             REDIRECT target ("upscale, restrained — not orange"), "" if none.
# Each like/dislike is a valenced { axis, toward? } over the closed feature-axis
# vocab (layout/type/color/space/motion/feel); a bare string "color" still parses
# (→ {axis:"color", toward:""}) for back-compat. So the steer is machine-consumable
# AND carries the human's actual intent (the redirect), not just the axis.
#
# Fail-fast (spec §6b):
#   exit 3 PRUNE_UNRESOLVED — a presented candidate id has NO feedback entry on
#          resume (no silent partial prune). Non-zero propagates → transition fails.
version: "1.0.0"
scripts:
  inspect.validate-prune:
    verb: inspect
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // Deterministic resume validator + steer aggregator. Always JSON on stdout.
      function j(v, d) { try { const x = JSON.parse(v); return x === undefined ? d : x; } catch { return d; } }
      const candidates = j(process.argv[2], []) || [];
      const feedback = j(process.argv[3], []) || [];

      // (a) No silent partial prune: every PRESENTED candidate must have a verdict.
      const feedbackIds = new Set(feedback.map((f) => f && f.candidate_id));
      const missing = candidates
        .map((c) => (c && c.id) || "")
        .filter((id) => id && !feedbackIds.has(id));
      if (missing.length > 0) {
        console.error(JSON.stringify({ error: "PRUNE_UNRESOLVED", missing }));
        process.exit(3);
      }

      const asArr = (x) => (Array.isArray(x) ? x : x == null || x === "" ? [] : [x]);

      // Normalizer: a like/dislike is a valenced { axis, toward }. Back-compat: a
      // bare string "color" still parses → { axis:"color", toward:"" } (no hard-fail).
      const norm = (x) => {
        if (x == null) return null;
        if (typeof x === "string") { const a = x.trim(); return a ? { axis: a, toward: "" } : null; }
        if (typeof x === "object" && x.axis != null && x.axis !== "")
          return { axis: String(x.axis), toward: x.toward == null ? "" : String(x.toward) };
        return null;
      };

      // Dedupe valenced items by axis, PRESERVING first-seen order and MERGING
      // distinct non-empty `toward` phrases with "; " (direction is never dropped).
      const dedupeByAxis = (raw) => {
        const order = [];
        const towards = new Map();
        for (const it of raw) {
          const n = norm(it);
          if (!n) continue;
          if (!towards.has(n.axis)) { towards.set(n.axis, []); order.push(n.axis); }
          const arr = towards.get(n.axis);
          if (n.toward && !arr.includes(n.toward)) arr.push(n.toward);
        }
        return order.map((axis) => ({ axis, toward: towards.get(axis).join("; ") }));
      };

      // (b) Aggregate the valenced steer.
      //   amplify = likes of ALL carried-forward directions (verdict != "reject":
      //             keep + branch + compose) — a composed direction's likes survive.
      //   avoid   = dislikes across the WHOLE spread (the redirect targets).
      const amplifyRaw = [];
      const avoidRaw = [];
      for (const f of feedback) {
        if (!f) continue;
        avoidRaw.push(...asArr(f.dislikes));
        if (f.verdict !== "reject") amplifyRaw.push(...asArr(f.likes));
      }

      console.log(JSON.stringify({
        steer: { amplify: dedupeByAxis(amplifyRaw), avoid: dedupeByAxis(avoidRaw) },
      }));
