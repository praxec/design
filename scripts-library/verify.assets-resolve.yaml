# scripts-library/verify.assets-resolve.yaml
#
# Make the two asset rules DETERMINISTIC instead of merely instructed.
#
# Allowing local assets (#4) traded one failure mode for two, and the pack could
# detect neither:
#
#   1. A REFERENCE TO A FILE THAT IS NOT THERE. Observed live: the operator's
#      brief named the artwork but a copy/paste slip dropped the filename list,
#      so the generator invented plausible names from the story titles —
#      `art/dragon-under-stairs.png`, `art/gran-1953.png` — and wrote eight
#      <img> tags pointing at nothing. The candidate parsed as HTML, passed
#      verify.candidate-renderable, scored, and was carried toward the human as
#      a legitimate direction. Four generations were spent before anyone noticed,
#      and only because a human looked at the pixels.
#
#   2. A NETWORK REFERENCE. "Renders with the network unplugged" is stated in
#      both prompt layers and checked by nothing. A CDN stylesheet or a Google
#      Fonts link would render beautifully on the machine that made it and
#      degrade silently anywhere else — including in the headless screenshotter.
#
# Both are the pack's own discipline applied to the newest surface: the agent's
# claim is not trusted, deterministic code re-opens the artifact, and a
# described-but-absent thing is a failure rather than a shrug.
#
# WHAT IS SCANNED: src / srcset / href / poster on any element, CSS url(...) in
# both inline <style> and style="" attributes, and SVG <image href>. Ignored,
# because they are not file references: data: URIs, fragment-only (#x),
# mailto:/tel:, and empty values.
#
#   Args: [artifact_path, baseline_path?]
#
# RETENTION (the optional second argument). After a revision pass, "every
# reference resolves" is satisfied by a page with NO images at all — and that is
# not hypothetical. A visual reviewer shown a page of broken-image icons deleted
# all eight of them, passed every gate, and was recorded as a successful
# revision. The copy guard permitted it correctly (an image reference is not
# copy), and the result was a page with no artwork on a product whose premise is
# that the artwork IS the design system.
#
# So when a baseline is given, a candidate that HAD resolvable local imagery and
# now has NONE is REVISION_STRIPPED_ASSETS. The rule is deliberately narrow:
# going from five plates to four is a design judgement and none of a validator's
# business; going to zero has removed the subject. A broad "must not use fewer
# assets" rule would misfire on every legitimate consolidation, and a rule that
# misfires gets turned off.
#
# Emits (ALWAYS exit 0 — routing belongs to the caller's gate):
#   { assets_ok: true,  checked: N, missing: [], network: [], reason: "" }
#   { assets_ok: false, checked: N, missing: [...], network: [...],
#     reason: "BROKEN_ASSET_REFERENCE" | "NETWORK_ASSET_REFERENCE"
#           | "REVISION_STRIPPED_ASSETS" }
# Only an unreadable artifact is a hard error (exit 2).
version: "1.0.0"
scripts:
  verify.assets-resolve:
    verb: verify
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // Deterministic asset-reference check. No LLM, no network — it never
      // FETCHES anything; a network reference is a failure, not a request.
      const { existsSync, statSync, readFileSync } = require("node:fs");
      const { dirname, resolve, join } = require("node:path");

      const artifact = process.argv[2];
      if (!artifact || !existsSync(artifact)) {
        console.error(JSON.stringify({ error: "ARTIFACT_MISSING", path: artifact || "" }));
        process.exit(2);
      }
      // ONE extractor, used for the artifact and for any baseline: a retention
      // check built on a second, slightly different parser would be a bug
      // generator rather than a guard.
      function referencesOf(file) {
        const html = readFileSync(file, "utf8");
        const refs = new Set();
        const add = (v) => {
          const s = String(v || "").trim();
          if (s) refs.add(s);
        };
        // Attribute references. srcset carries a comma-separated candidate list
        // with descriptors ("a.png 2x"), so split it before taking the URL half.
        for (const m of html.matchAll(/\b(?:src|href|poster)\s*=\s*["']([^"']+)["']/gi)) add(m[1]);
        for (const m of html.matchAll(/\bsrcset\s*=\s*["']([^"']+)["']/gi)) {
          for (const part of m[1].split(",")) add(part.trim().split(/\s+/)[0]);
        }
        // CSS url(...) — inline <style> blocks and style="" attributes alike.
        for (const m of html.matchAll(/url\(\s*["']?([^"')]+)["']?\s*\)/gi)) add(m[1]);
        return refs;
      }

      // How many referenced LOCAL files actually resolve, relative to `dir`.
      function resolvableCount(refs, dir) {
        let n = 0;
        for (const ref of refs) {
          if (/^data:/i.test(ref) || /^(?:mailto|tel|javascript):/i.test(ref)) continue;
          if (ref.startsWith("#")) continue;
          if (/^[a-z][a-z0-9+.-]*:\/\//i.test(ref) || ref.startsWith("//")) continue;
          const clean = ref.split("#")[0].split("?")[0];
          if (!clean || clean.startsWith("/")) continue;
          const abs = resolve(join(dir, clean));
          if (existsSync(abs) && statSync(abs).isFile()) n++;
        }
        return n;
      }

      const base = dirname(resolve(artifact));
      const refs = referencesOf(artifact);

      const missing = [];
      const network = [];
      let checked = 0;

      for (const ref of refs) {
        // Not file references at all.
        if (/^data:/i.test(ref)) continue;
        if (/^(?:mailto|tel|javascript):/i.test(ref)) continue;
        if (ref.startsWith("#")) continue;

        // A network reference: absolute URL or protocol-relative. The page must
        // render with the network unplugged, so this is a failure on sight —
        // never something to go and check.
        if (/^[a-z][a-z0-9+.-]*:\/\//i.test(ref) || ref.startsWith("//")) {
          network.push(ref);
          continue;
        }

        checked++;
        // Strip any query/fragment before touching the filesystem.
        const clean = ref.split("#")[0].split("?")[0];
        if (!clean) continue;
        // A root-relative path has no meaning for a self-contained candidate —
        // there is no document root to resolve it against.
        const abs = clean.startsWith("/") ? clean : resolve(join(base, clean));
        if (!existsSync(abs) || !statSync(abs).isFile()) missing.push(ref);
      }

      // RETENTION. Checked only once the references that ARE present have been
      // found sound — a broken page is already failing for a better reason.
      const baseline = process.argv[3];
      if (missing.length === 0 && network.length === 0 && baseline) {
        if (!existsSync(baseline)) {
          console.error(JSON.stringify({ error: "BASELINE_MISSING", path: baseline }));
          process.exit(2);
        }
        const had = resolvableCount(referencesOf(baseline), dirname(resolve(baseline)));
        const has = resolvableCount(refs, base);
        if (had > 0 && has === 0) {
          console.log(JSON.stringify({
            assets_ok: false, checked, missing: [], network: [],
            reason: "REVISION_STRIPPED_ASSETS", had_assets: had, has_assets: has,
          }));
          process.exit(0);
        }
      }

      if (missing.length === 0 && network.length === 0) {
        console.log(JSON.stringify({ assets_ok: true, checked, missing: [], network: [], reason: "" }));
        process.exit(0);
      }
      console.log(JSON.stringify({
        assets_ok: false,
        checked,
        // Bounded so a pathological artifact cannot flood the run context; the
        // counts stay exact.
        missing: missing.slice(0, 25),
        network: network.slice(0, 25),
        missing_count: missing.length,
        network_count: network.length,
        // Network is reported first when both are present: it is the stricter
        // rule and the one that fails on someone else's machine rather than here.
        reason: network.length ? "NETWORK_ASSET_REFERENCE" : "BROKEN_ASSET_REFERENCE",
      }));
