# scripts-library/run.generate-direction.yaml
#
# ============================ STUB — Increment I ============================
# This is NOT 21st. It is NOT an LLM. It performs NO generation from a frontier
# model. It is a DETERMINISTIC fixture-candidate emitter so the annealing spine
# (generate → render → score → detect) is exercisable HEADLESS and OFFLINE
# before the real 21st MCP generation cap lands in Increment II (spec §9).
#
# What it honestly does: given a hard-constraint seed, it writes a real,
# renderable, self-contained HTML file that GENUINELY honors the seed's
# corners / type / grid (and adds heavy rules + a display moment + a bold
# accent so an in-seed brutalist/editorial candidate scores as it should).
# The emitted HTML is authored by THIS stub — it is never labelled as, and must
# never be presented as, "generated by 21st".
# ===========================================================================
#
#   Args: [out_dir, seed_json, candidate_id?]
#     out_dir       directory to write the candidate HTML into (created if absent)
#     seed_json     the seed constraint set as JSON; recognised keys:
#                     corners: "square" | "round"
#                     type:    "serif" | "mono" | "sans"
#                     grid:    "asymmetric" | "symmetric"
#     candidate_id  optional stable id (defaults to stub-<epoch-ms>)
#
# Emits { candidate: { id, artifact, seed, generator: "stub-fixture-v1" } }.
# Fail-fast: exit 2 on missing out_dir or unparseable seed.
version: "1.0.0"
scripts:
  run.generate-direction:
    verb: run
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // STUB generator (see file header). Deterministic, offline, no LLM.
      const { mkdirSync, writeFileSync } = require("node:fs");
      const { join } = require("node:path");

      const outDir = process.argv[2];
      if (!outDir) {
        console.error(JSON.stringify({ error: "OUT_DIR_UNSET" }));
        process.exit(2);
      }
      let seed = {};
      try {
        seed = process.argv[3] ? JSON.parse(process.argv[3]) : {};
      } catch {
        console.error(JSON.stringify({ error: "SEED_UNPARSEABLE" }));
        process.exit(2);
      }
      const id = process.argv[4] || `stub-${Date.now()}`;

      // Translate the seed's hard constraints into concrete CSS the scorer reads
      // (features.mjs): square corners, an unequal-fr (non-repeat) grid, a
      // serif/mono font stack, no gradient, heavy rules, a display step, a bold accent.
      const square = seed.corners !== "round";
      const radius = square ? "0" : "14px";
      const font =
        seed.type === "serif"
          ? "Georgia, 'Times New Roman', serif"
          : seed.type === "mono"
          ? "'JetBrains Mono', 'SF Mono', ui-monospace, monospace"
          : "system-ui, sans-serif";
      const grid =
        seed.grid === "symmetric"
          ? "grid-template-columns: repeat(3, 1fr);"
          : "grid-template-columns: 2fr 5fr 3fr;"; // unequal fr = asymmetric

      const html = `<!doctype html>
      <html lang="en">
      <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <meta name="generator" content="praxec/design stub-fixture-v1 (NOT 21st)" />
      <title>candidate ${id}</title>
      <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
          margin: 0; background: #ffffff; color: #111111;
          font-family: ${font};
        }
        .frame { border: 8px solid #111111; margin: 24px; }
        header { border-bottom: 8px solid #111111; padding: 24px 28px; }
        h1 { font-size: 108px; line-height: 0.92; margin: 0; letter-spacing: -0.02em; }
        .accent { color: #e5231b; }
        main { display: grid; ${grid} gap: 0; }
        section { border-right: 6px solid #111111; padding: 24px 28px; border-radius: ${radius}; }
        section:last-child { border-right: 0; }
        h2 { font-size: 15px; margin: 0 0 12px; }
        .card { border: 4px solid #111111; padding: 16px; margin-top: 16px; border-radius: ${radius}; }
        p { font-size: 17px; line-height: 1.5; }
      </style>
      </head>
      <body>
        <div class="frame">
          <header>
            <h1>Made <span class="accent">on purpose</span></h1>
          </header>
          <main>
            <section>
              <h2>Column A</h2>
              <div class="card"><p>Structural candidate honoring the seed constraints.</p></div>
              <div class="card"><p>Square corners, asymmetric grid, heavy rules.</p></div>
            </section>
            <section>
              <h2>Column B</h2>
              <div class="card"><p>This artifact is authored by the Increment-I STUB generator, not by 21st or any LLM.</p></div>
            </section>
            <section>
              <h2>Column C</h2>
              <div class="card"><p>It exists so the generate → render → score → detect spine runs offline.</p></div>
            </section>
          </main>
        </div>
      </body>
      </html>`;

      mkdirSync(outDir, { recursive: true });
      const artifact = join(outDir, `candidate-${id}.html`);
      writeFileSync(artifact, html);
      console.log(JSON.stringify({
        candidate: { id, artifact, seed, generator: "stub-fixture-v1" },
      }));
