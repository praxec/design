# scripts-library/run.set-seeds.yaml
#
# The SEED-SET OWNER for flow.anneal.structure-first — the single writer of the
# mutable `seeds` slot, used at BOTH ends of the annealing loop:
#
#   round 1 (seeding):  chosen == {}  →  echo the operator's input seed set.
#   refine  (tighten):  chosen has a seed  →  CONVERGE on the survivor:
#                        tightened `seeds = [ chosen.seed ]` (spec §1 "progressively
#                        reduce entropy" / §6 "refine ↺ over the survivor").
#
# ONE cap owns the slot so `$.context.seeds` has a `use.outputs` writer (V13:
# only slots written by `inputs:` or a child's `use.outputs` may feed a later
# `use.inputs` — a noop `output:` seed would NOT make `seeds` re-usable by the
# diverge picker). Increment II widens the refine branch to survivor-derived
# perturbations + crossover; the wire shape here is stable.
#
# LOOP CLOSURE (spec §6b) — the third arg carries the human's VALENCED STEER: when
# the prune-and-steer gate produces { amplify:[{axis,toward}], avoid:[{axis,toward}] }
# from the human's per-candidate reactions, we FOLD it into each tightened seed's
# `notes` field as directional text so the downstream generation prompt carries
# "amplify: color→upscale not orange, type; avoid: feel→premium" — the human's
# actual redirect, not just the axis (axis-only "avoid color" is meaningless to a
# generator; every design has a color). The seed is
# the annealing state; the steer is the gradient the next divergence anneals
# toward. HONEST BOUNDARY: the OFFLINE stub generator (run.generate-direction)
# IGNORES seed semantics, so the offline drive proves the PLUMBING (the steer
# lands in the tightened seed) — the EFFECT (steer changing generated designs)
# only manifests with the real Kimi generation cap, which reads the seed. Assert
# the plumbing at the SEED level, not at the stub candidate level.
# Backward-compatible: no steer (or empty amplify/avoid) → today's behavior exactly.
#
# Args (script arg renderer stringifies object/array values):
#   $1 — seeds_in (JSON array; the operator's seed constraint-set objects)
#   $2 — chosen   (JSON object; {} on round 1, else the survivor { id, seed, ... })
#   $3 — steer    (JSON object; {} when absent, else valenced
#                  { amplify:[{axis,toward}], avoid:[{axis,toward}] })
#
# Emits ONE JSON verdict on stdout, read at $.output.json.*; ALWAYS exits 0:
#   { seeds: array (the seed set for the round about to diverge) }
version: "1.0.0"
scripts:
  run.set-seeds:
    verb: run
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // Deterministic seed-set owner: echo (round 1) or converge (refine),
      // folding the human's steer into the tightened seed (loop closure).
      function j(v, d) { try { const x = JSON.parse(v); return x === undefined ? d : x; } catch { return d; } }
      const seedsIn = j(process.argv[2], []) || [];
      const chosen = j(process.argv[3], {}) || {};
      const steer = j(process.argv[4], {}) || {};
      const survivorSeed =
        chosen && typeof chosen.seed === "object" && chosen.seed !== null
          ? chosen.seed
          : null;
      let seeds = survivorSeed ? [survivorSeed] : (Array.isArray(seedsIn) ? seedsIn : []);

      // Fold the VALENCED steer into each seed's `notes` so the next generation
      // prompt carries direction, not just axis: "amplify: color→upscale not orange,
      // type; avoid: feel→premium". Each steer item is { axis, toward }; render
      // `axis→toward` when a redirect is present, else the bare axis. A bare-string
      // item still parses (back-compat). No-op when steer is empty.
      const norm = (x) => {
        if (x == null) return null;
        if (typeof x === "string") { const a = x.trim(); return a ? { axis: a, toward: "" } : null; }
        if (typeof x === "object" && x.axis != null && x.axis !== "")
          return { axis: String(x.axis), toward: x.toward == null ? "" : String(x.toward) };
        return null;
      };
      const items = (x) => (Array.isArray(x) ? x.map(norm).filter(Boolean) : []);
      const render = (arr) => arr.map((n) => (n.toward ? `${n.axis}→${n.toward}` : n.axis));
      // VALENCE. A dislike's `toward` is the REDIRECT TARGET — where the human
      // wants the next divergence to GO — not a thing to shun. Rendering that
      // bucket under the word "avoid" inverted the human's intent: a human who
      // asked to move toward a storybook palette produced the seed note
      // "avoid: color→storybook palette", instructing the generator to shun the
      // very thing they asked for. The steer is the ONLY channel carrying human
      // taste into the next round, so an ambiguity here is worse than no steer.
      // Only an axis-ONLY dislike (the human named an axis but no direction) is
      // a true avoid; anything with a direction is rendered as a redirect.
      const renderRedirect = (arr) =>
        arr.map((n) => (n.toward ? `on ${n.axis}, go toward: ${n.toward}` : `avoid ${n.axis}`));
      const amplify = items(steer.amplify);
      const avoid = items(steer.avoid);
      if (amplify.length || avoid.length) {
        const parts = [];
        if (amplify.length) parts.push(`amplify: ${render(amplify).join(", ")}`);
        if (avoid.length) parts.push(renderRedirect(avoid).join("; "));
        const note = parts.join("; ");
        seeds = seeds.map((s) => {
          const seed = s && typeof s === "object" ? { ...s } : { value: s };
          seed.notes = [seed.notes, note].filter(Boolean).join(" | ");
          seed.steer = { amplify, avoid };
          return seed;
        });
      }
      console.log(JSON.stringify({ seeds }));
