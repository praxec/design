# scripts-library/verify.surface-rolled.yaml
#
# The coding-write-evidence VERIFIER for the REAL apply cap
# (design/cap.implement.apply-design-system, Increment IV-c). The rollout agent's
# own claim is NOT trusted: this deterministic step re-opens the EDITED surface at
# its own repo path (repo_root/<surface.file>) and confirms a real, non-empty file
# was written IN PLACE. It is the fail-fast SURFACE_NOT_ROLLED gate — the symmetric
# counterpart of the generation spine's verify.candidate-renderable (spec §4b/§5).
# The token-adherence + detect gates run SEPARATELY in the flow.rollout orchestrator
# (as they do for the offline stub twin) — this leaf only proves the edited file
# exists + parses (it is `.astro`/`.css`/`.tsx`, not necessarily HTML).
#
#   Args: [repo_root, surface_json, attempt?]
#     repo_root     absolute path to the target repo the agent edited in place
#     surface_json  the surface descriptor { id, file, layout_type } (echoed out);
#                   `file` is the repo-relative path of the edited surface
#     attempt       optional retry attempt (carried into the record)
#   The artifact path is repo_root/<surface.file> (the edited file at its own path).
#
# Emits (ALWAYS exit 0 — routing is done by the cap's verify_gate on `rolled_ok`):
#   { rolled_ok: true,  rolled: { id, artifact, file, layout_type, generator, attempt }, reason: "" }
#   { rolled_ok: false, rolled: {},                                                       reason: "SURFACE_NOT_ROLLED" }
# Only a genuinely missing arg is a hard error (exit 2): a missing/unparseable
# surface is a first-class NOT_ROLLED verdict, not a crash.
version: "1.0.0"
scripts:
  verify.surface-rolled:
    verb: verify
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // Deterministic edited-surface verifier. No LLM, no network.
      const { existsSync, readFileSync } = require("node:fs");
      const { join, isAbsolute } = require("node:path");

      const repoRoot = process.argv[2];
      if (!repoRoot) {
        console.error(JSON.stringify({ error: "REPO_ROOT_UNSET" }));
        process.exit(2);
      }
      let surface = {};
      try {
        surface = process.argv[3] ? JSON.parse(process.argv[3]) : {};
      } catch {
        console.error(JSON.stringify({ error: "SURFACE_UNPARSEABLE" }));
        process.exit(2);
      }
      const attempt = parseInt(process.argv[4] || "0", 10) || 0;
      const id = surface.id || "";
      const rel = surface.file || "";
      // The edited file is at its OWN repo path (repo_root/<surface.file>) — the
      // agent rewrote it in place, not into an out_dir.
      const artifact = isAbsolute(rel) ? rel : join(repoRoot, rel);

      const notRolled = (message) =>
        console.log(JSON.stringify({
          rolled_ok: false,
          rolled: {},
          reason: "SURFACE_NOT_ROLLED",
          message,
        }));

      // 0. A surface with no relative path can never have been edited in place.
      if (!rel) {
        notRolled("surface has no `file` (repo-relative path) to edit in place");
        process.exit(0);
      }
      // 1. The edited file must actually exist (a described-but-unwritten edit).
      if (!existsSync(artifact)) {
        notRolled(`edited surface was not written in place: ${artifact}`);
        process.exit(0);
      }
      // 2. It must parse as a real, non-empty source file (.astro / .css / .tsx —
      //    NOT necessarily HTML). An empty/whitespace-only file is a failed edit.
      const source = readFileSync(artifact, "utf8");
      if (source.trim().length === 0) {
        notRolled(`edited surface is empty: ${artifact}`);
        process.exit(0);
      }
      // Rolled — emit the record (mirrors the stub's `rolled` contract so the
      // token-adherence + detect gates downstream are identical). `artifact` is the
      // edited file at its own repo path.
      console.log(JSON.stringify({
        rolled_ok: true,
        reason: "",
        rolled: {
          id,
          artifact,
          file: rel,
          layout_type: surface.layout_type || "",
          generator: "rollout-agent (rollout affinity → deepseek)",
          attempt,
        },
      }));
