# scripts-library/inspect.next-surface.yaml
#
# The FAN-OUT CURSOR for flow.rollout (spec §4b divergence over surfaces). Iterating
# the surface list and rolling one surface per step is a code job, not an LLM
# judgment ("deterministic tools over LLM math"). Given the surface array + a
# cursor, PEEK the surface at the cursor (does NOT advance — the collector advances
# on success, so a failed surface can be re-rolled by the bounded retry) — or emit
# a terminal `exhausted` phase when the cursor has reached len(surfaces).
#
# WHY A CO-LOCATED CAP (not an inline script): a flow's slot table (V13) only
# recognizes slots written by `inputs:` or a child workflow's `use.outputs` — NOT
# by a transition `output:` block — so an inline pick could not feed the picked
# `current_surface` into the apply step's `use.inputs`. Wrapping this pick in a
# snippet-typed cap (cap.inspect.next-surface) makes it a first-class slot (the same
# constraint that produced cap.inspect.next-seed).
#
# PEEK, NOT ADVANCE (differs from next-seed on purpose): the rollout retries a
# non-adherent surface in place, so the cursor must NOT advance at pick time —
# cap.inspect.collect-surface advances it only after the surface is collected.
# Termination is still bounded: collect advances monotonically to len(surfaces),
# and each surface's retries are bounded by the flow's max_retry.
#
# Args (script arg renderer stringifies object/array values):
#   $1 — surfaces array (JSON; array of surface descriptor OBJECTS)
#   $2 — surface_idx (int; the cursor)
#
# Emits ONE JSON verdict on stdout, read at $.output.json.*; ALWAYS exits 0 (the
# verdict lives in `phase`, never the exit code):
#   { phase: "picked" | "exhausted" | "invalid",
#     current_surface: object (surfaces[idx]; {} unless picked),
#     surface_id: string ("" unless picked) }
version: "1.0.0"
scripts:
  inspect.next-surface:
    verb: inspect
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // Deterministic fan-out cursor over the rollout's surface list (peek-only).
      function j(v) { try { return JSON.parse(v); } catch { return undefined; } }
      const surfaces = j(process.argv[2] || "[]");
      const idx = parseInt(process.argv[3] || "0", 10);

      if (!Array.isArray(surfaces) || Number.isNaN(idx)) {
        console.log(JSON.stringify({ phase: "invalid", current_surface: {}, surface_id: "" }));
        process.exit(0);
      }
      if (idx >= 0 && idx < surfaces.length) {
        const s = surfaces[idx] || {};
        console.log(JSON.stringify({
          phase: "picked",
          current_surface: s,
          surface_id: s.id || `surface-${idx}`,
        }));
      } else {
        console.log(JSON.stringify({ phase: "exhausted", current_surface: {}, surface_id: "" }));
      }
