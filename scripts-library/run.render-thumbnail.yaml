# scripts-library/run.render-thumbnail.yaml
#
# ============================ REAL THUMBNAIL (browserful) ====================
# The human contact sheet needs the ACTUAL rendered design, not a placeholder.
# This shells out to the pack's shared REAL-PIXELS render primitive
# (render-screenshot.mjs — the same Puppeteer install snapshot.mjs uses) to
# capture a bounded PNG of the candidate, then emits the SAME `thumbnail` output
# KEY the cap maps. Because the engine exposes no pack-dir scope, `scripts_dir`
# (abs path to this pack's scripts-library/, holding render-screenshot.mjs) is
# threaded in as an arg — exactly the seam score-axes / capture-incumbent use.
# ===========================================================================
#
#   Args: [scripts_dir, candidate(url|file), out_dir, candidate_id?]
#
# Emits { thumbnail: { id, artifact, of: <candidate> } } where `artifact` is the
# ABSOLUTE path of the written PNG.
# Fail-fast (spec §5): exit 3 CANDIDATE_NOT_RENDERABLE when the candidate is a
# local file that is absent OR does not look like parseable HTML, when the
# renderer cannot be spawned, or when it produces no pixels — a candidate you
# cannot render can never reach the human prune.
version: "1.0.0"
scripts:
  run.render-thumbnail:
    verb: run
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // REAL renderer: wrap the pack's render-screenshot.mjs (Puppeteer PNG).
      const { existsSync, mkdirSync, readFileSync } = require("node:fs");
      const { join, basename, resolve } = require("node:path");
      const { execFileSync } = require("node:child_process");

      const scriptsDir = process.argv[2];
      const candidate = process.argv[3];
      const outDir = process.argv[4];
      const id = process.argv[5] || (candidate ? basename(candidate).replace(/\.html?$/i, "") : "unknown");

      if (!scriptsDir || !candidate || !outDir) {
        console.error(JSON.stringify({ error: "ARGS_UNSET", need: ["scripts_dir", "candidate", "out_dir"] }));
        process.exit(2);
      }

      // A URL is rendered live; a local artifact must exist AND parse as HTML
      // (the offline candidate contract — a candidate you can't render can't
      // reach the human prune).
      const isUrl = /^https?:\/\//i.test(candidate);
      if (!isUrl) {
        if (!existsSync(candidate)) {
          console.error(JSON.stringify({
            error: "CANDIDATE_NOT_RENDERABLE",
            message: `candidate does not exist: ${candidate}`,
          }));
          process.exit(3);
        }
        const html = readFileSync(candidate, "utf8");
        if (!/<html|<!doctype|<body/i.test(html)) {
          console.error(JSON.stringify({
            error: "CANDIDATE_NOT_RENDERABLE",
            message: `candidate does not parse as HTML: ${candidate}`,
          }));
          process.exit(3);
        }
      }

      mkdirSync(outDir, { recursive: true });
      const artifact = resolve(join(outDir, `thumb-${id}.png`));
      const renderer = join(scriptsDir, "render-screenshot.mjs");

      let out;
      try {
        // fold @ 1000px: a faithful-but-compact viewport view for the sheet grid.
        const raw = execFileSync("node", [renderer, candidate, artifact, "fold", "1000"], {
          encoding: "utf8",
          maxBuffer: 16 * 1024 * 1024,
        });
        out = JSON.parse(String(raw).trim().split("\n").pop());
      } catch (e) {
        console.error(JSON.stringify({
          error: "CANDIDATE_NOT_RENDERABLE",
          message: `render-screenshot spawn failed: ${String((e && e.message) || e)}`,
        }));
        process.exit(3);
      }
      if (!out || out.ok !== true || !existsSync(artifact)) {
        console.error(JSON.stringify({
          error: "CANDIDATE_NOT_RENDERABLE",
          message: "render produced no pixels",
          detail: out,
        }));
        process.exit(3);
      }

      console.log(JSON.stringify({
        thumbnail: { id, artifact, of: candidate },
      }));
