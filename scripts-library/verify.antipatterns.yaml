# scripts-library/verify.antipatterns.yaml
#
# The deterministic USABILITY FLOOR of the annealing spine (spec §3.5 / §2).
# Wraps `npx impeccable detect --json <artifact>` — a real, LLM-free anti-
# pattern detector — and reduces its findings array to a floor verdict, SPLIT BY
# SEVERITY (Increment I-e):
#   { detect: [...],                    # the FULL findings array (all severities)
#     antipattern_count: N,             # BLOCKING only (error/critical) — the floor input
#     usable: (N == 0),                 # errors-only: "no usability-breaking findings"
#     warnings: [{antipattern,name,severity,snippet}],  # non-blocking, carried as quality-flags
#     warning_count: M }.
# The floor gates on BLOCKING severity only; `warning`/`info`/`notice` findings
# no longer hard-block a candidate — they surface to the human on the contact
# sheet and feed the refine loop. FAIL SAFE: an unknown/missing severity is
# treated as blocking, so a new high-severity name can never silently pass.
#
# NOTE (Task-1 finding, spec §3.5): `detect` is the USABILITY floor, NOT a
# genericness signal — a clean generic design passes with zero anti-patterns.
# Distinctiveness is `G` (geometry), scored separately by inspect.score-axes.
# Two distinct roles, both kept.
#
# This is NOT a stub: impeccable detect is the production gate. It needs no
# auth and no network beyond the one-time `npx` package fetch (cached after).
#
# Fail-fast: exit 3 CANDIDATE_NOT_RENDERABLE when the artifact file is absent
# (a floor cannot be asserted over a candidate that does not exist), exit 4
# DETECT_FAILED / DETECT_UNPARSEABLE when detect cannot produce parseable JSON.
# A clean run (usable or not) exits 0 — the anti-pattern COUNT is data the
# gate branches on, not an error.
version: "1.0.0"
scripts:
  verify.antipatterns:
    verb: verify
    lifecycle: experimental
    source: design
    body: |
      #!/usr/bin/env node
      // Args: [artifact] — path to the rendered candidate HTML.
      const { existsSync } = require("node:fs");
      const { execFileSync } = require("node:child_process");
      const artifact = process.argv[2];
      if (!artifact) {
        console.error(JSON.stringify({ error: "ARTIFACT_UNSET" }));
        process.exit(2);
      }
      if (!existsSync(artifact)) {
        console.error(JSON.stringify({
          error: "CANDIDATE_NOT_RENDERABLE",
          message: `artifact does not exist: ${artifact}`,
        }));
        process.exit(3);
      }
      let out;
      try {
        out = execFileSync("npx", ["--yes", "impeccable", "detect", "--json", artifact], {
          encoding: "utf8",
          stdio: ["ignore", "pipe", "ignore"],
          maxBuffer: 8 * 1024 * 1024,
        });
      } catch (err) {
        // detect exits non-zero when it finds findings; stdout still holds JSON.
        out = err.stdout ? err.stdout.toString() : "";
        if (!out) {
          console.error(JSON.stringify({ error: "DETECT_FAILED", message: String(err.message) }));
          process.exit(4);
        }
      }
      let findings;
      try {
        findings = JSON.parse((out || "").trim() || "[]");
      } catch {
        console.error(JSON.stringify({ error: "DETECT_UNPARSEABLE" }));
        process.exit(4);
      }
      const arr = Array.isArray(findings) ? findings : (findings.detect || []);
      // SEVERITY SPLIT (Increment I-e): the usability FLOOR gates on BLOCKING
      // findings only (error/critical). `warning`/`info`/`notice` are carried
      // through as visible quality-flags — the human (taste authority) sees them
      // on the contact sheet, the refine loop can act on them, but they no longer
      // hard-block an otherwise-distinctive candidate. FAIL SAFE: any severity NOT
      // in the known non-blocking set (incl. missing/unknown high-severity names)
      // counts as blocking, so a new severity can never silently pass the floor.
      const NON_BLOCKING = new Set(["warning", "info", "notice"]);

      // SELF-INFLICTED FINDINGS. This pack REQUIRES every candidate to be a single
      // self-contained HTML file with "no external fonts/styles/scripts/images",
      // so an inline <svg> is the ONLY way a candidate can show artwork at all.
      // `shape-assembled-illustration` flags exactly that — it is a style
      // observation about placeholder art, not a usability error, and it arrives
      // at `advisory`, the same severity the genericness detectors use, so the
      // floor was silently dropping candidates for obeying our own constraint.
      // Worse, it scales with effort: the richer the placeholder plates, the more
      // likely the drop. Observed live — a candidate the human ranked best never
      // reached the prune gate. Exempt by IDENTITY, not by severity, so the
      // genericness findings at the same severity keep their teeth.
      const SELF_INFLICTED = new Set(["shape-assembled-illustration"]);
      const isBlocking = (f) => {
        const id = String((f && (f.antipattern || f.id)) || "").toLowerCase();
        if (SELF_INFLICTED.has(id)) return false;
        return !NON_BLOCKING.has(String((f && f.severity) || "").toLowerCase());
      };
      const blocking = arr.filter(isBlocking);
      const warnings = arr.filter((f) => !isBlocking(f)).map((f) => ({
        antipattern: f && f.antipattern,
        name: f && f.name,
        severity: f && f.severity,
        snippet: f && f.snippet,
      }));
      const count = blocking.length; // BLOCKING-ONLY — the eligibility floor's input.
      console.log(JSON.stringify({
        detect: arr,
        antipattern_count: count,
        usable: count === 0,
        warnings,
        warning_count: warnings.length,
      }));
