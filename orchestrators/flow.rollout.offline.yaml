# orchestrators/flow.rollout.offline.yaml
#
# ===================== OFFLINE TWIN — the headless drive test substrate =====
# An EXACT twin of the production rollout spine (flow.rollout) that differs in ONE
# leaf: the per-surface fan-out spawns the OFFLINE per-surface pipeline
# (design/flow.rollout.surface.offline, whose apply leaf is the deterministic stub
# design/cap.run.apply-design-system) instead of the REAL per-surface pipeline
# (design/flow.rollout.surface → design/cap.implement.apply-design-system, a
# `kind: agent` step → deepseek). This mirrors the anneal twins
# (flow.anneal.structure-first[.offline]).
#
# WHY A TWIN EXISTS (honest — a real duplication, forced by the engine):
#   - praxec `kind: workflow` `definitionId:` is a STATIC, check-resolved reference
#     (V22) — it cannot be parameterised per run, so "stub vs real apply" cannot be
#     a runtime input to ONE orchestrator.
#   - `kind: agent` is not a legal offline path (it requires models.yaml + a
#     provider key/credit), and the pack's NO-FALLBACK rule forbids the real cap
#     silently degrading to the stub.
#   Therefore the production spine (real apply) and the offline drive test (stub
#   apply) are two thin orchestrators over the SAME shared per-surface + gate caps.
#   Only the per-surface pipeline's `applying` leaf differs; keep the twins in sync.
#
# THE SPINE (spec §4b, Increment IV-b):
#   capture(design system → token contract) → centralize(one shared source) →
#   FAN OUT over the surface list IN BOUNDED PARALLEL (engine `kind: parallel`, one
#   branch per surface, ≤ max_parallel at once): each branch is
#   design/flow.rollout.surface.offline (apply(stub) → token-adherence(the anti-
#   regression heart) + detect(usability floor) → gate → bounded-retry). An adherent
#   surface ends `done`; an off-system surface ends `failed`, and the parent folds
#   the fan-in failed_count into ROLLOUT_REGRESSED → else assemble → done.
#   (Real cpm-plan waves + real deepseek + real gh PR-open are IV-b/IV-c.)
#
# Driven by scripts-library/smoke.rollout.sh (offline: no LLM, no gh, no key).
# ===========================================================================

workflows:

  flow.rollout.offline:
    lifecycle: experimental
    description: >
      OFFLINE TWIN of flow.rollout: identical capture → centralize → BOUNDED-PARALLEL
      per-surface fan-out → fan-in gate spine, but each branch is the deterministic
      offline per-surface pipeline (design/flow.rollout.surface.offline) so the whole
      spine is drivable HEADLESS + OFFLINE with no OpenRouter key/credit. Proves the
      anti-regression floor: an adherent surface collects; an off-system surface
      (defect:true) fails token-adherence and, after bounded retry, folds up to
      ROLLOUT_REGRESSED. Test substrate only; production uses flow.rollout.
    inputs:
      # The surfaces to roll (each { id, file, layout_type, defect? }). A fixed
      # 2-surface stub list by default; the smoke overrides it (adherent set vs an
      # injected off-system surface).
      surfaces:
        type: array
        default:
          - { id: "landing", file: "src/pages/index.astro", layout_type: "landing" }
          - { id: "blog",    file: "src/pages/blog/index.astro", layout_type: "blog" }
      # The approved design-system markdown to capture into the token contract.
      design_system_path: { type: string,  default: "" }
      # The repo-relative path to the ONE central token source (stylesheet) that
      # becomes the single source of truth: the `centralizing` step (offline stub)
      # defines the captured contract THERE as `:root` custom properties, and every
      # surface then CONSUMES them rather than re-pasting token values.
      token_target:       { type: string,  default: "src/styles/global.css" }
      # Absolute path to this pack's scripts-library/ (threaded to the script caps).
      scripts_dir:        { type: string,  default: "" }
      # Absolute path to the TARGET REPO whose surface files are EDITED IN PLACE by
      # the stub (each surface.file is relative to this root). The gates run on
      # repo_root/<surface.file> (the edited fixture) — same seam as the real twin.
      repo_root:          { type: string,  default: "" }
      # Bounded per-surface retry budget before a non-adherent surface flags
      # ROLLOUT_REGRESSED. With the deterministic stub, a defect surface is stable,
      # so it exhausts the budget and regresses (the anti-regression proof).
      max_retry:          { type: integer, default: 1 }
      # The bounded-parallel WAVE SIZE (mirrors flow.rollout). The `max_concurrency`
      # literal on the `rolling` fan-out mirrors this default — the engine reads that
      # field statically, not from input (see flow.rollout header note).
      max_parallel:       { type: integer, default: 3 }
    outputs:
      tokens:       { type: object }
      rolled:       { type: array }
      rolled_count: { type: integer }
      off_system:   { type: array }
      reason:       { type: string }
    initialContext:
      tokens:       {}
      centralized:  {}
      rolled:       []
      rolled_count: 0
      off_system:   []
      fail_count:   0
      reason:       ""
    initialState: capturing
    states:

      # CAPTURE — parse the approved design-system markdown into the token contract
      # the per-surface gate enforces (sub-instance; threads scripts_dir).
      capturing:
        goal: Capture the design system into the canonical token contract.
        transitions:
          capture:
            target: centralizing
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.inspect.capture-tokens
              use:
                inputs:
                  scripts_dir:        "$.workflow.input.scripts_dir"
                  design_system_path: "$.workflow.input.design_system_path"
                outputs:
                  "$.context.tokens": tokens

      # CENTRALIZE (offline stub) — the keystone that prevents "consistent
      # snowflakes": BEFORE any page is touched, the DETERMINISTIC stub EDITS the ONE
      # central token source (repo_root/<token_target>) IN PLACE so the captured
      # contract lives THERE as `:root` custom properties. This is a BARRIER — the
      # parallel fan-out depends on this shared source and starts only after it
      # completes. The ONLY leaf (with the per-surface `applying`) that differs from
      # the production spine — here a stub, there a real agent.
      centralizing:
        goal: Centralize the token contract into the one shared source (offline stub).
        transitions:
          centralize:
            target: rolling
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.run.centralize-tokens
              use:
                inputs:
                  repo_root:    "$.workflow.input.repo_root"
                  token_target: "$.workflow.input.token_target"
                  tokens:       "$.context.tokens"
                outputs:
                  "$.context.centralized": centralized

      # FAN OUT — one branch per surface, BOUNDED to max_parallel at a time. Each
      # branch is the deterministic offline per-surface pipeline
      # (design/flow.rollout.surface.offline): apply(stub) → token-adherence →
      # detect → gate → bounded-retry. The `centralizing` barrier guarantees the
      # central tokens exist before any branch consumes them.
      #
      # join: expression "$.failed_count >= 0" is an ALWAYS-TRUE reduce — the fan-out
      # is a pure map; the ROLLOUT_REGRESSED verdict is the `rollout_gate` below, on
      # the fan-in failed_count. on_branch_failure: continue drains EVERY surface so
      # failed_count counts all regressed surfaces (the anti-regression proof).
      rolling:
        goal: Roll every surface to the token contract, bounded-parallel (offline).
        transitions:
          roll_all:
            target: rollout_gate
            actor: deterministic
            executor:
              kind: parallel
              branches:
                for_each: "$.workflow.input.surfaces"
                do:
                  kind: workflow
                  definitionId: design/flow.rollout.surface.offline
                  # `use:` (not legacy `input:`): the use-shape resolves branch inputs
                  # against $.workflow.input + $.context (legacy `input:` sees only
                  # arguments/context — it can't read $.workflow.input), and returns
                  # the child's declared outputs (rekeyed by name) as the branch output.
                  use:
                    inputs:
                      surface:      "$.branch.value"
                      repo_root:    "$.workflow.input.repo_root"
                      tokens:       "$.context.tokens"
                      token_target: "$.workflow.input.token_target"
                      scripts_dir:  "$.workflow.input.scripts_dir"
                      max_retry:    "$.workflow.input.max_retry"
                    outputs:
                      "$.context._rolled":     rolled
                      "$.context._adherent":   adherent
                      "$.context._off_system": off_system
              join: { expression: "$.failed_count >= 0" }
              on_branch_failure: continue
              # WAVE-SIZE THROTTLE — mirrors the max_parallel input default (engine
              # reads this statically, not from input; keep the two in sync).
              max_concurrency: 3
              total_timeout_ms: 3600000
            output:
              rolled:       "$.output.branches"
              rolled_count: "$.output.summary.ok_count"
              fail_count:   "$.output.summary.failed_count"

      # FAN-IN GATE — every surface adherent (failed_count == 0) ⇒ assemble ; any
      # surface still off-system after its retry budget (failed_count > 0) ⇒
      # ROLLOUT_REGRESSED.
      rollout_gate:
        transitions:
          assemble:
            target: assembling
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count == 0" }
          regress:
            target: fail_regressed
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count > 0" }

      # FAIL-FAST ROLLOUT_REGRESSED (spec §4b): at least one surface is still
      # off-system after the retry budget (folded up as a branch failure).
      fail_regressed:
        goal: Record the ROLLOUT_REGRESSED fail-fast reason.
        transitions:
          mark:
            target: failed
            actor: deterministic
            executor: { kind: noop }
            output:
              reason: { set: "ROLLOUT_REGRESSED" }

      # ASSEMBLE — every surface cleared the gate; the `rolled` fan-in holds every
      # adherent surface branch. Real gh PR-open on the target repo_root is IV-c;
      # here the collected set IS the assembled rollout (PR-plan payload).
      assembling:
        goal: Assemble the collected adherent surfaces (PR-plan; real gh is IV-c).
        transitions:
          assemble:
            target: done
            actor: deterministic
            executor: { kind: noop }
            output:
              reason: { set: "ROLLOUT_COMPLETE" }

      done:
        terminal: true
        outcome: success

      failed:
        terminal: true
        outcome: failure
