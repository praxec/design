# orchestrators/flow.rollout.surface.offline.yaml
#
# ============= OFFLINE TWIN of the PER-SURFACE PIPELINE (IV-b) ==============
# An EXACT twin of flow.rollout.surface that differs in ONE leaf: the `applying`
# step calls the OFFLINE STUB (design/cap.run.apply-design-system, a deterministic
# in-place token-normalizer) instead of the REAL model-driven cap
# (design/cap.implement.apply-design-system, a `kind: agent` step → deepseek).
# This is the per-surface unit flow.rollout.offline fans out with `kind: parallel`
# (one branch per surface). Because every leaf is deterministic, a branch drives
# to terminal HEADLESS + OFFLINE with no models.yaml binding / OpenRouter key.
#
# WHY A TWIN EXISTS (same forced duplication as the parent twins): praxec
# `kind: workflow` `definitionId:` is a STATIC, check-resolved reference (V22) —
# "stub vs real apply" cannot be a runtime input to ONE flow, and the pack's
# NO-FALLBACK rule forbids the real cap silently degrading to the stub. So the
# production per-surface flow (real apply) and this offline twin (stub apply) are
# two thin flows over the SAME shared gate caps (token-adherence,
# detect-antipatterns). Only the `applying` leaf differs; keep them in sync.
# ===========================================================================

workflows:

  flow.rollout.surface.offline:
    lifecycle: experimental
    description: >
      OFFLINE TWIN of flow.rollout.surface: identical apply → token-adherence +
      detect gates → gate → bounded-retry chain, but the apply leaf uses the
      deterministic offline STUB (design/cap.run.apply-design-system) so the branch
      drives HEADLESS + OFFLINE with no OpenRouter key/credit. Proves the
      anti-regression floor per surface: an adherent surface ends `done`; an
      off-system surface (defect:true) fails token-adherence and, after bounded
      retry, ends `failed` (the parent parallel folds it into ROLLOUT_REGRESSED).
      Test substrate only; production uses flow.rollout.surface.
    inputs:
      # The single surface descriptor { id, file, layout_type, defect? } this branch
      # rolls (the parent parallel passes one array element per branch).
      surface:      { type: object,  required: true }
      # Absolute path to the TARGET REPO whose surface file is EDITED IN PLACE.
      repo_root:    { type: string,  default: "" }
      # The captured token contract { colors, fonts, scale }.
      tokens:       { type: object,  default: {} }
      # The repo-relative path to the ONE central token source the surface CONSUMES.
      token_target: { type: string,  default: "src/styles/global.css" }
      # Absolute path to this pack's scripts-library/ (threaded to the gate caps).
      scripts_dir:  { type: string,  default: "" }
      # Bounded per-surface retry budget before this surface flags off-system.
      max_retry:    { type: integer, default: 1 }
    outputs:
      rolled:     { type: object }
      adherent:   { type: boolean }
      off_system: { type: array }
    # Every declared output seeds its honest empty floor here (V24) and is
    # overwritten on the success edge; the surface's own id rides out inside the
    # `rolled` record (rolled.id), so no separate surface_id output is needed.
    initialContext:
      retry:                  0
      rolled_surface:         {}
      rolled:                 {}
      tok_adherent:           true
      off_system:             []
      tok_count:              0
      cand_antipattern_count: 0
      fail_count:             0
      adherent:               false
    initialState: applying
    states:

      # APPLY one surface — the OFFLINE STUB (the ONLY leaf that differs from the
      # production twin). EDITS the fixture at repo_root/<surface.file> IN PLACE to
      # be token-adherent (or, for a defect:true surface, injects an off-system
      # color/font the gate will block).
      applying:
        goal: Roll the surface to the token contract in place (offline stub).
        transitions:
          apply:
            target: verifying_tokens
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.run.apply-design-system
              use:
                inputs:
                  repo_root:    "$.workflow.input.repo_root"
                  surface:      "$.workflow.input.surface"
                  tokens:       "$.workflow.input.tokens"
                  token_target: "$.workflow.input.token_target"
                outputs:
                  "$.context.rolled_surface": rolled

      # GATE 1 — THE ANTI-REGRESSION HEART: token-adherence. `count` (an integer)
      # is the scalar the gate branches on.
      verifying_tokens:
        goal: Assert the rolled surface uses ONLY the design system's tokens.
        transitions:
          verify:
            target: verifying_detect
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.verify.token-adherence
              use:
                inputs:
                  scripts_dir: "$.workflow.input.scripts_dir"
                  artifact:    "$.context.rolled_surface.artifact"
                  tokens:      "$.workflow.input.tokens"
                outputs:
                  "$.context.tok_adherent": adherent
                  "$.context.off_system":   off_system
                  "$.context.tok_count":    count

      # GATE 2 — REUSED usability floor: detect-antipatterns (blocking-only count).
      verifying_detect:
        goal: Run the deterministic usability floor over the rolled surface.
        transitions:
          detect:
            target: tallying
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.verify.detect-antipatterns
              use:
                inputs:
                  artifact: "$.context.rolled_surface.artifact"
                outputs:
                  "$.context.cand_antipattern_count": antipattern_count

      # TALLY — fold both gate verdicts into ONE scalar the surface gate branches on
      # (fail_count == 0 ⇔ token-adherent AND detect-clean). Avoids an OR guard.
      tallying:
        goal: Combine the token-adherence + detect verdicts into a single fail count.
        transitions:
          tally:
            target: surface_gate
            actor: deterministic
            executor: { kind: noop }
            output:
              fail_count: { add: ["$.context.tok_count", "$.context.cand_antipattern_count"] }

      # SURFACE GATE — commodity can't regress: pass ⇒ done (mark adherent + emit
      # the rolled record as the branch output) ; fail with retry budget ⇒ re-roll ;
      # fail exhausted ⇒ failed (the parent parallel folds this into
      # ROLLOUT_REGRESSED via failed_count).
      surface_gate:
        transitions:
          collect:
            target: done
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count == 0" }
            output:
              adherent: { set: true }
              rolled:   "$.context.rolled_surface"
          retry:
            target: retrying
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count > 0" }
              - { kind: expr, expr: "$.context.retry < $.workflow.input.max_retry" }
          regress:
            target: failed
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count > 0" }
              - { kind: expr, expr: "$.context.retry >= $.workflow.input.max_retry" }

      # RETRY — a non-adherent surface within budget: bump the attempt, re-roll the
      # SAME surface. With the deterministic stub a defect surface is stable, so it
      # exhausts the budget and ends `failed` (the anti-regression proof).
      retrying:
        goal: Re-roll the non-adherent surface (bounded retry).
        transitions:
          retry:
            target: applying
            actor: deterministic
            executor: { kind: noop }
            output:
              retry: { add: ["$.context.retry", 1] }

      # DONE — the surface cleared both gates (adherent + rolled record written on
      # the collect edge). The branch output carries the collected surface.
      done:
        terminal: true
        outcome: success

      # FAILED — still off-system after the retry budget. Ends failure so the
      # parent parallel branch reports failed_count (⇒ ROLLOUT_REGRESSED).
      failed:
        terminal: true
        outcome: failure
