# orchestrators/flow.rollout.yaml
#
# ======================== PRODUCTION ROLLOUT SPINE — spec §4b ================
# Apply an APPROVED design system across a target repo's surfaces with a COMMODITY
# model, GATED so it can't regress to off-system. Frontier (Kimi) created the
# design; this flow propagates it (deepseek). Built as a governed pack flow.
#
# This is the PRODUCTION twin of flow.rollout.offline. It differs in EXACTLY ONE
# leaf: the per-surface fan-out spawns the REAL per-surface pipeline
# (design/flow.rollout.surface, whose apply leaf is the model-driven
# design/cap.implement.apply-design-system → deepseek) instead of the offline
# per-surface twin (design/flow.rollout.surface.offline, deterministic stub).
# EVERYTHING else — capture, centralize, the PARALLEL fan-out, the fan-in gate,
# the ROLLOUT_REGRESSED fail-fast — is shared, structurally, with the offline twin.
#
# INCREMENT STATUS (docs/2026-08-03-increment-4-rollout-plan.md):
#   - IV-a (built): the spine + the token-adherence gate + the offline stub twin.
#   - IV-b (THIS change): the per-surface work runs as a BOUNDED PARALLEL fan-out
#     (engine `kind: parallel`, one branch per surface) instead of a sequential
#     cursor. Each branch is the self-contained per-surface pipeline
#     (design/flow.rollout.surface): apply → token-adherence → detect → gate →
#     bounded-retry. A surface still off-system after its retry budget ends its
#     branch `failed`; the parent folds that per-branch failure through the fan-in
#     `failed_count` into ROLLOUT_REGRESSED.
#   - IV-c: wire the target repo_root (writable) + real gh PR-open after assemble,
#     and actually run the rollout.
#
# CONCURRENCY BOUND (max_parallel): the fan-out is throttled so we never fire all N
# commodity (deepseek) calls at once. The throttle is the engine's native
# `kind: parallel` `max_concurrency` field. NB (engine ground truth): the parallel
# executor reads `max_concurrency` as a STATIC integer at config-parse
# (ParallelExecutor / ParallelConfig::from_value → as_u64 on the raw, unresolved
# config) — it is NOT a `$.`-resolved field, so it cannot be driven from a runtime
# input. The `max_parallel` input is therefore the operator-facing wave-size knob
# and the `max_concurrency` literal below MIRRORS its default; keep the two in sync.
# ===========================================================================

workflows:

  flow.rollout:
    lifecycle: experimental
    # Governed commodity apply across N surfaces (centralize + per-page consume) is
    # legitimately long; raise the default 30-min mission-deadline backstop so a real
    # multi-page rollout completes (bounded 2h; the adherence gate + retry ladder are
    # the real governors).
    missionDeadlineSecs: 7200
    description: >
      PRODUCTION rollout: capture an approved design system into a token contract,
      centralize it into the one shared source, then fan out over a target repo's
      surfaces IN BOUNDED PARALLEL — each branch is the per-surface pipeline
      (design/flow.rollout.surface): a commodity `rollout`-affinity agent (deepseek)
      rolls the surface to the tokens + its layout-type, GATED by the deterministic
      token-adherence heart (anti-regression) + the detect usability floor, with a
      bounded per-surface retry. An adherent surface is collected; a surface still
      off-system after its retry budget fails its branch and the run flags
      ROLLOUT_REGRESSED. The collected adherent surfaces are the PR-plan payload
      (real gh PR-open is IV-c). The offline twin (flow.rollout.offline) drives the
      same spine headless with a deterministic stub.
    inputs:
      # The surfaces to roll (each { id, file, layout_type }). Real cpm-plan waves
      # feed this in IV-b; a fixed default list here for a single-wave rollout.
      surfaces:
        type: array
        default:
          - { id: "landing", file: "src/pages/index.astro", layout_type: "landing" }
          - { id: "blog",    file: "src/pages/blog/index.astro", layout_type: "blog" }
      # The approved design-system markdown to capture into the token contract.
      design_system_path: { type: string,  default: "" }
      # The repo-relative path to the ONE central token source (stylesheet) that
      # becomes the single source of truth: the `centralizing` step defines the
      # captured contract THERE as `:root` custom properties, and every surface
      # then CONSUMES them (via var(--...)) rather than re-pasting token values.
      token_target:       { type: string,  default: "src/styles/global.css" }
      # Absolute path to this pack's scripts-library/ (threaded to the script caps).
      scripts_dir:        { type: string,  default: "" }
      # Absolute path to the TARGET REPO whose surface files are EDITED IN PLACE
      # (each surface.file is relative to this root). The apply agent's file host is
      # rooted here; the gates run on repo_root/<surface.file> (the edited file).
      repo_root:          { type: string,  default: "" }
      # Bounded per-surface retry budget before a non-adherent surface flags
      # ROLLOUT_REGRESSED (a drifting commodity model is re-prompted, then flagged).
      max_retry:          { type: integer, default: 1 }
      # The bounded-parallel WAVE SIZE — at most this many surfaces roll at once, so
      # we never fire all N deepseek calls simultaneously. See the CONCURRENCY BOUND
      # note in the header: the `max_concurrency` literal on the `rolling` fan-out
      # mirrors this default (the engine reads that field statically, not from input).
      max_parallel:       { type: integer, default: 3 }
    outputs:
      tokens:       { type: object }
      rolled:       { type: array }
      rolled_count: { type: integer }
      off_system:   { type: array }
      reason:       { type: string }
    initialContext:
      tokens:       {}
      centralized:  {}
      rolled:       []
      rolled_count: 0
      off_system:   []
      fail_count:   0
      reason:       ""
    initialState: capturing
    states:

      # CAPTURE — parse the approved design-system markdown into the token contract
      # the per-surface gate enforces (sub-instance; threads scripts_dir).
      capturing:
        goal: Capture the design system into the canonical token contract.
        transitions:
          capture:
            target: centralizing
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.inspect.capture-tokens
              use:
                inputs:
                  scripts_dir:        "$.workflow.input.scripts_dir"
                  design_system_path: "$.workflow.input.design_system_path"
                  repo_root:          "$.workflow.input.repo_root"
                outputs:
                  "$.context.tokens": tokens

      # CENTRALIZE — the keystone that prevents "consistent snowflakes": BEFORE any
      # page is touched, a `rollout`-affinity agent (real deepseek) EDITS the ONE
      # central token source (repo_root/<token_target>) IN PLACE so the captured
      # contract lives THERE as `:root` custom properties and the shared classes
      # consume them via var(--...). This is a BARRIER — the parallel fan-out below
      # depends on this shared token source and starts only after it completes.
      centralizing:
        goal: Centralize the token contract into the one shared source (real deepseek).
        transitions:
          centralize:
            target: rolling
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.implement.centralize-tokens
              use:
                inputs:
                  repo_root:    "$.workflow.input.repo_root"
                  token_target: "$.workflow.input.token_target"
                  tokens:       "$.context.tokens"
                outputs:
                  "$.context.centralized": centralized

      # FAN OUT — one branch per surface, BOUNDED to max_parallel at a time. Each
      # branch is the self-contained per-surface pipeline (design/flow.rollout.surface):
      # apply(real deepseek) → token-adherence → detect → gate → bounded-retry. The
      # `centralizing` barrier above guarantees the central tokens exist before any
      # branch consumes them.
      #
      # join: expression "$.failed_count >= 0" is an ALWAYS-TRUE reduce — the fan-out
      # is a pure map; the ROLLOUT_REGRESSED verdict is the `rollout_gate` below, on
      # the fan-in failed_count. (An `all`/percent join would either hard-error the
      # transition on the first regressed surface — no clean route to the
      # ROLLOUT_REGRESSED terminal — or, for percent:0, abort siblings on first
      # success.) on_branch_failure: continue drains EVERY surface so failed_count
      # counts all regressed surfaces, not just the first.
      rolling:
        goal: Roll every surface to the token contract, bounded-parallel.
        transitions:
          roll_all:
            target: rollout_gate
            actor: deterministic
            executor:
              kind: parallel
              branches:
                for_each: "$.workflow.input.surfaces"
                do:
                  kind: workflow
                  definitionId: design/flow.rollout.surface
                  # `use:` (not legacy `input:`): the use-shape resolves branch inputs
                  # against $.workflow.input + $.context (legacy `input:` sees only
                  # arguments/context — it can't read $.workflow.input), and returns
                  # the child's declared outputs (rekeyed by name) as the branch output.
                  use:
                    inputs:
                      surface:      "$.branch.value"
                      repo_root:    "$.workflow.input.repo_root"
                      tokens:       "$.context.tokens"
                      token_target: "$.workflow.input.token_target"
                      scripts_dir:  "$.workflow.input.scripts_dir"
                      max_retry:    "$.workflow.input.max_retry"
                    outputs:
                      "$.context._rolled":     rolled
                      "$.context._adherent":   adherent
                      "$.context._off_system": off_system
              join: { expression: "$.failed_count >= 0" }
              on_branch_failure: continue
              # WAVE-SIZE THROTTLE — never fire all N deepseek calls at once. Static
              # literal (engine reads it at parse, not from input); mirrors the
              # max_parallel input default (keep the two in sync — see header note).
              max_concurrency: 3
              total_timeout_ms: 3600000
            output:
              rolled:       "$.output.branches"
              rolled_count: "$.output.summary.ok_count"
              fail_count:   "$.output.summary.failed_count"

      # FAN-IN GATE — the anti-regression verdict on the collected fan-out: every
      # surface adherent (failed_count == 0) ⇒ assemble ; any surface still
      # off-system after its retry budget (failed_count > 0) ⇒ ROLLOUT_REGRESSED.
      rollout_gate:
        transitions:
          assemble:
            target: assembling
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count == 0" }
          regress:
            target: fail_regressed
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count > 0" }

      # FAIL-FAST ROLLOUT_REGRESSED (spec §4b): at least one surface is still
      # off-system after the retry budget (folded up as a branch failure).
      fail_regressed:
        goal: Record the ROLLOUT_REGRESSED fail-fast reason.
        transitions:
          mark:
            target: failed
            actor: deterministic
            executor: { kind: noop }
            output:
              reason: { set: "ROLLOUT_REGRESSED" }

      # ASSEMBLE — every surface cleared the gate; the `rolled` fan-in holds every
      # adherent surface branch. Real gh PR-open on the target repo_root is IV-c;
      # here the collected set IS the assembled rollout (PR-plan payload).
      assembling:
        goal: Assemble the collected adherent surfaces (PR-plan; real gh is IV-c).
        transitions:
          assemble:
            target: done
            actor: deterministic
            executor: { kind: noop }
            output:
              reason: { set: "ROLLOUT_COMPLETE" }

      done:
        terminal: true
        outcome: success

      failed:
        terminal: true
        outcome: failure
