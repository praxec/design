# orchestrators/flow.rollout.yaml
#
# ======================== PRODUCTION ROLLOUT SPINE — spec §4b ================
# Apply an APPROVED design system across a target repo's surfaces with a COMMODITY
# model, GATED so it can't regress to off-system. Frontier (Kimi) created the
# design; this flow propagates it (deepseek). Built as a governed pack flow.
#
# This is the PRODUCTION twin of flow.rollout.offline. It differs in EXACTLY ONE
# leaf: the `applying` step calls the REAL model-driven cap (design/cap.implement.
# apply-design-system, a `kind: agent` step bound to the `rollout` affinity →
# deepseek, `requires_file_write: true`) instead of the offline stub
# (design/cap.run.apply-design-system). EVERYTHING else — capture, the fan-out
# cursor, the token-adherence + detect gates, the collector, the retry ladder, the
# ROLLOUT_REGRESSED fail-fast — is shared, byte-for-byte, with the offline twin
# (mirrors flow.anneal.structure-first[.offline]).
#
# Because the apply leaf is `kind: agent`, this flow REQUIRES gateway.models_yaml
# (AGENT_MODELS_YAML_REQUIRED) binding the `rollout` activity to a commodity model
# + a provider key/credit. The offline twin needs neither (deterministic stub).
#
# INCREMENT STATUS (docs/2026-08-03-increment-4-rollout-plan.md):
#   - IV-a (built): this spine + the token-adherence gate + the offline stub twin.
#   - IV-b: wire the REAL cpm-planner (surface waves) ahead of the fan-out.
#   - IV-c: wire the target repo_root (writable) + real gh PR-open after assemble,
#     and actually run the rollout.
# ===========================================================================

workflows:

  flow.rollout:
    lifecycle: experimental
    description: >
      PRODUCTION rollout: capture an approved design system into a token contract,
      then fan out over a target repo's surfaces — a commodity `rollout`-affinity
      agent (deepseek) rolls each surface to the tokens + its layout-type, GATED by
      the deterministic token-adherence heart (anti-regression) + the detect
      usability floor. Pass ⇒ collect ; off-system ⇒ bounded retry ; exhausted ⇒
      ROLLOUT_REGRESSED. The collected adherent surfaces are the PR-plan payload
      (real gh PR-open is IV-c). The offline twin (flow.rollout.offline) drives the
      same spine headless with a deterministic stub.
    inputs:
      # The surfaces to roll (each { id, file, layout_type }). Real cpm-plan waves
      # feed this in IV-b; a fixed default list here for a single-wave rollout.
      surfaces:
        type: array
        default:
          - { id: "landing", file: "src/pages/index.astro", layout_type: "landing" }
          - { id: "blog",    file: "src/pages/blog/index.astro", layout_type: "blog" }
      # The approved design-system markdown to capture into the token contract.
      design_system_path: { type: string,  default: "" }
      # Absolute path to this pack's scripts-library/ (threaded to the script caps).
      scripts_dir:        { type: string,  default: "" }
      # Directory to write rolled surfaces into.
      out_dir:            { type: string,  default: "" }
      # Bounded per-surface retry budget before a non-adherent surface flags
      # ROLLOUT_REGRESSED (a drifting commodity model is re-prompted, then flagged).
      max_retry:          { type: integer, default: 1 }
    outputs:
      tokens:       { type: object }
      rolled:       { type: array }
      rolled_count: { type: integer }
      off_system:   { type: array }
      reason:       { type: string }
    initialContext:
      tokens:                 {}
      surface_idx:            0
      retry:                  0
      rolled:                 []
      rolled_count:           0
      phase:                  ""
      current_surface:        {}
      surface_id:             ""
      rolled_surface:         {}
      tok_adherent:           true
      off_system:             []
      tok_count:              0
      cand_antipattern_count: 0
      fail_count:             0
      reason:                 ""
    initialState: capturing
    states:

      # CAPTURE — parse the approved design-system markdown into the token contract
      # the per-surface gate enforces (sub-instance; threads scripts_dir).
      capturing:
        goal: Capture the design system into the canonical token contract.
        transitions:
          capture:
            target: rolling
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.inspect.capture-tokens
              use:
                inputs:
                  scripts_dir:        "$.workflow.input.scripts_dir"
                  design_system_path: "$.workflow.input.design_system_path"
                outputs:
                  "$.context.tokens": tokens

      # FAN-OUT CURSOR — peek the surface at the cursor (shared cap; peek-only so a
      # non-adherent surface can be re-rolled in place).
      rolling:
        goal: Pick the next surface to roll (or exhaust the list).
        transitions:
          pick:
            target: roll_gate
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.inspect.next-surface
              use:
                inputs:
                  surfaces:    "$.workflow.input.surfaces"
                  surface_idx: "$.context.surface_idx"
                outputs:
                  "$.context.phase":           phase
                  "$.context.current_surface": current_surface
                  "$.context.surface_id":      surface_id

      roll_gate:
        transitions:
          apply:
            target: applying
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.phase == 'picked'" }
          assemble:
            target: assembling
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.phase == 'exhausted'" }
          unexpected:
            target: fail_unexpected
            actor: deterministic

      # APPLY one surface — the REAL model-driven cap (the ONLY leaf that differs
      # from the offline twin): a `rollout`-affinity agent WRITES the surface to the
      # token contract + layout-type; a deterministic verifier confirms the write.
      applying:
        goal: Roll the picked surface to the token contract (real deepseek).
        transitions:
          apply:
            target: verifying_tokens
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.implement.apply-design-system
              use:
                inputs:
                  out_dir: "$.workflow.input.out_dir"
                  surface: "$.context.current_surface"
                  tokens:  "$.context.tokens"
                  attempt: "$.context.retry"
                outputs:
                  "$.context.rolled_surface": rolled

      # GATE 1 — THE ANTI-REGRESSION HEART: token-adherence (sub-instance; threads
      # scripts_dir). `count` (an integer) is the scalar the gate branches on.
      verifying_tokens:
        goal: Assert the rolled surface uses ONLY the design system's tokens.
        transitions:
          verify:
            target: verifying_detect
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.verify.token-adherence
              use:
                inputs:
                  scripts_dir: "$.workflow.input.scripts_dir"
                  artifact:    "$.context.rolled_surface.artifact"
                  tokens:      "$.context.tokens"
                outputs:
                  "$.context.tok_adherent": adherent
                  "$.context.off_system":   off_system
                  "$.context.tok_count":    count

      # GATE 2 — REUSED usability floor: detect-antipatterns (blocking-only count).
      verifying_detect:
        goal: Run the deterministic usability floor over the rolled surface.
        transitions:
          detect:
            target: tallying
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.verify.detect-antipatterns
              use:
                inputs:
                  artifact: "$.context.rolled_surface.artifact"
                outputs:
                  "$.context.cand_antipattern_count": antipattern_count

      # TALLY — fold both gate verdicts into ONE scalar the surface gate branches on
      # (fail_count == 0 ⇔ token-adherent AND detect-clean). Avoids an OR guard.
      tallying:
        goal: Combine the token-adherence + detect verdicts into a single fail count.
        transitions:
          tally:
            target: surface_gate
            actor: deterministic
            executor: { kind: noop }
            output:
              fail_count: { add: ["$.context.tok_count", "$.context.cand_antipattern_count"] }

      # SURFACE GATE — commodity can't regress: pass ⇒ collect + advance ; fail with
      # retry budget ⇒ re-roll ; fail exhausted ⇒ ROLLOUT_REGRESSED.
      surface_gate:
        transitions:
          collect:
            target: collecting
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count == 0" }
          retry:
            target: retrying
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count > 0" }
              - { kind: expr, expr: "$.context.retry < $.workflow.input.max_retry" }
          regress:
            target: fail_regressed
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.fail_count > 0" }
              - { kind: expr, expr: "$.context.retry >= $.workflow.input.max_retry" }

      # COLLECT — append the gate-passing surface + advance the cursor + reset retry
      # (shared cap; array-append lives in code per V13).
      collecting:
        goal: Collect the adherent surface; advance the cursor; loop.
        transitions:
          collect:
            target: rolling
            actor: deterministic
            executor:
              kind: workflow
              definitionId: design/cap.inspect.collect-surface
              use:
                inputs:
                  rolled_surface: "$.context.rolled_surface"
                  rolled_in:      "$.context.rolled"
                  surface_idx:    "$.context.surface_idx"
                outputs:
                  "$.context.rolled":       rolled
                  "$.context.rolled_count": rolled_count
                  "$.context.surface_idx":  next_idx
                  "$.context.retry":        retry_reset

      # RETRY — a non-adherent surface within budget: bump the attempt, re-roll the
      # SAME surface (the cursor did not advance).
      retrying:
        goal: Re-roll the non-adherent surface (bounded retry).
        transitions:
          retry:
            target: applying
            actor: deterministic
            executor: { kind: noop }
            output:
              retry: { add: ["$.context.retry", 1] }

      # FAIL-FAST ROLLOUT_REGRESSED (spec §4b): a surface still off-system after the
      # retry budget. `off_system` in context names the offending color(s)/font(s).
      fail_regressed:
        goal: Record the ROLLOUT_REGRESSED fail-fast reason.
        transitions:
          mark:
            target: failed
            actor: deterministic
            executor: { kind: noop }
            output:
              reason: { set: "ROLLOUT_REGRESSED" }

      fail_unexpected:
        goal: Record a broken fan-out phase contract.
        transitions:
          mark:
            target: failed
            actor: deterministic
            executor: { kind: noop }
            output:
              reason: { set: "UNEXPECTED_PICK_PHASE" }

      # ASSEMBLE — the surface list is exhausted; the `rolled` ledger holds every
      # adherent surface. Real gh PR-open on the target repo_root is IV-c; here the
      # collected set IS the assembled rollout (PR-plan payload).
      assembling:
        goal: Assemble the collected adherent surfaces (PR-plan; real gh is IV-c).
        transitions:
          assemble:
            target: done
            actor: deterministic
            executor: { kind: noop }
            output:
              reason: { set: "ROLLOUT_COMPLETE" }

      done:
        terminal: true
        outcome: success

      failed:
        terminal: true
        outcome: failure
